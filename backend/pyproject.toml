[project]
name = "aerogram"
version = "0.1.0"
description = "Aerogram Logistic OS — единый слой между грузоотправителем и транспортными компаниями"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "httpx>=0.27.2",
    "tenacity>=9.0.0",
    "redis>=5.2.0",
    "celery[redis]>=5.4.0",
    "structlog>=24.4.0",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.10.0",
    "cryptography>=43.0.0",
    "pyyaml>=6.0.2",
    "python-multipart>=0.0.17",
    "email-validator>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-recording>=0.13.2",
    "testcontainers[postgres]>=4.8.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "import-linter>=2.1",
    "types-pyyaml>=6.0.12",
    "pip-audit>=2.7.3",
    "pip-licenses>=5.0.0",
    "schemathesis>=3.38.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aerogram"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "DTZ",       # timezone-aware datetime
    "T20",       # никаких print
    "SIM",       # simplify
    "RUF",
    "ASYNC",
    "S",         # bandit
]
ignore = [
    "B008",      # Depends() в аргументах по умолчанию — идиома FastAPI
    # Проект русскоязычный: комментарии, докстроки и тексты ошибок на кириллице.
    # Правила «неоднозначных символов» здесь дают только шум.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]     # assert и тестовые пароли — норма в тестах
"alembic/*" = ["E501", "S608"]           # DDL собирается из имён таблиц, не из ввода
# Имена доменных ошибок заданы ТЗ (раздел 8.2) и читаются как предметные понятия:
# NotFound, Conflict, PermissionDenied. Суффикс Error здесь ухудшил бы читаемость.
"src/aerogram/shared/errors.py" = ["N818"]

[tool.ruff.lint.isort]
known-first-party = ["aerogram"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["aerogram"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true

# Строгий режим там, где ошибка агента дороже всего (CLAUDE.md §6)
[[tool.mypy.overrides]]
module = [
    "aerogram.shared.*",
    "aerogram.carriers.*",
    "aerogram.rating.*",
    "aerogram.shipments.*",
]
strict = true

# Celery не поставляет аннотации типов.
[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
    "integration: требует поднятых Postgres и Redis",
    "carrier_sandbox: обращается к боевому sandbox перевозчика, вручную",
]

[tool.coverage.run]
source = ["src/aerogram"]
omit = ["*/worker/*", "*/main.py"]

# Производственный календарь РФ.
#
# ВНИМАНИЕ. Этот файл обновляется ЕЖЕГОДНО, вручную, по постановлению Правительства РФ
# о переносе выходных дней (FR-6.2). Пока год не сверен с официальным документом,
# он помечен verified: false: расчёт фактического срока по нему выполняется по базовым
# нерабочим праздничным дням (ТК РФ, ст. 112) без переносов и рабочих суббот.
#
# Незаполненный календарь искажает фактический срок доставки, а через него — Carrier Score.
# Проверка «текущий год сверен» вынесена в тест и в утренний дайджест.

base_holidays:  # нерабочие праздничные дни, ТК РФ ст. 112 (месяц-день)
  - "01-01"
  - "01-02"
  - "01-03"
  - "01-04"
  - "01-05"
  - "01-06"
  - "01-07"
  - "01-08"
  - "02-23"
  - "03-08"
  - "05-01"
  - "05-09"
  - "06-12"
  - "11-04"

years:
  2026:
    verified: false
    # holidays: дополнительные нерабочие дни (перенесённые выходные), формат ГГГГ-ММ-ДД
    holidays: []
    # working_weekends: субботы и воскресенья, объявленные рабочими
    working_weekends: []
  2027:
    verified: false
    holidays: []
    working_weekends: []

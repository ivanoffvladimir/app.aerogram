# Карта статусов ПЭК → нормализованная модель (раздел 9 ТЗ).
#
# Ключи — нормализованные статусы Aerogram, значения — НАИМЕНОВАНИЯ статусов
# ПЭК (поле `name` в ответе /cargos/statusfullhistory/ и `cargoStatus`
# в /cargos/status/).
#
# ПОЧЕМУ ПО ИМЕНИ, А НЕ ПО КОДУ. У ПЭК есть числовые идентификаторы статусов,
# и они устойчивее названий. Но полный их перечень отдаёт только метод
# /cargos/statustables/, недостижимый без доступов, а в документации видны
# лишь несколько (3 «Принят», 4 «Возвращен отправителю», 8 «Выдан на складе»,
# 4000 «Забор груза заказан», 4100 «Забор груза запланирован»). Зато перечень
# НАЗВАНИЙ документация приводит целиком. Карта по именам покрывает
# жизненный цикл сразу; при получении доступов её следует перевести на коды,
# вызвав /cargos/statustables/.
#
# Регистр не важен: загрузчик приводит ключи к верхнему.
# Несопоставленное название не роняет обработку: событие получает IN_TRANSIT
# и попадает в очередь ручного сопоставления.

carrier_code: pecom
statuses:
  CREATED:
    - ЗАЯВКА НА ЗАБОР ЗАРЕГИСТРИРОВАНА
    - ЗАБОР ГРУЗА ЗАКАЗАН
    - ЗАБОР ГРУЗА ЗАПЛАНИРОВАН
    - ОЖИДАЕТСЯ ПЕРЕДАЧА ГРУЗА ОТ ОТПРАВИТЕЛЯ
  ACCEPTED:
    - ОФОРМЛЕН
    - ПРИНЯТ
  PICKED_UP:
    - ПРИНЯТ К ПЕРЕВОЗКЕ
    - ПРИНЯТ НА ПВЗ
  IN_TRANSIT:
    - В ПУТИ
    - В ПУТИ НА ТЕРМИНАЛ
  AT_DESTINATION_HUB:
    - ПРИБЫЛ
    - ПРИБЫЛ ЧАСТИЧНО
    - РАЗГРУЖАЕТСЯ. ОЖИДАЙТЕ ОПОВЕЩЕНИЯ
  OUT_FOR_DELIVERY:
    - ВЫПОЛНЯЕТСЯ АДРЕСНАЯ ДОСТАВКА
  DELIVERED:
    - ВЫДАН ПОЛУЧАТЕЛЮ
    - ДОСТАВЛЕН ПОЛУЧАТЕЛЮ
    - ВЫДАН НА СКЛАДЕ
    - ВЫДАН
  RETURN_IN_PROGRESS:
    - ОТПРАВЛЕН НА ВОЗВРАТ
  RETURNED:
    - ВОЗВРАЩЕН ОТПРАВИТЕЛЮ
  CANCELLED:
    - АННУЛИРОВАНО ДО ПРИЕМКИ ГРУЗА
  EXCEPTION:
    - УТИЛИЗИРОВАН
    - ИЗЪЯТ НА ТАМОЖНЕ

# Карта статусов Деловых Линий → нормализованная модель (раздел 9 ТЗ).
#
# Ключи — нормализованные статусы Aerogram, значения — коды статусов
# Деловых Линий (поле `state` в журнале заказов и в истории статусов).
#
# ИСТОЧНИК И ЕГО ГРАНИЦА. Коды взяты из официальной OpenAPI перевозчика
# (ADR-0020): они встречаются в примерах `statusHistory`, в описаниях полей
# `state` и в фильтре `request.states`. Полный справочник живёт по адресу
# dev.dellin.ru/api/catalogs/directories/#_header32 и отдаётся методом
# `/v1/references/statuses` — из окружения разработки оба недостижимы
# (QRATOR блокирует диапазон IP). Значит **этот перечень неполон**, и он
# обязан быть сверен при получении доступов вызовом справочника.
#
# Несопоставленный код не роняет обработку: событие получает IN_TRANSIT
# и попадает в очередь ручного сопоставления.

carrier_code: dellin
statuses:
  CREATED:
    # Заявка создана и обрабатывается перевозчиком.
    - NEW
    - PROCESSING
  ACCEPTED:
    # Ожидает сдачи на терминал — груз ещё у отправителя.
    - WAITING
  PICKED_UP:
    # Забор груза от адреса отправителя.
    - PICKUP
  IN_TRANSIT:
    - INWAY
  AT_DESTINATION_HUB:
    # Прибыл в город получения.
    - ARRIVED
  OUT_FOR_DELIVERY:
    # Выдача: доставка до адреса получателя или выдача на терминале.
    - GIVEOUT
  DELIVERED:
    - DELIVERED
    - FINISHED
  CANCELLED:
    - CANCELED
    - DECLINED

# Локальная разработка. Прод — в compose.prod.yaml.
name: aerogram

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aerogram_migrator
      POSTGRES_PASSWORD: migrator
      POSTGRES_DB: aerogram
      # Локаль обязана быть UTF-8. В локали C PostgreSQL не сворачивает регистр
      # кириллицы: lower('РОМАШКА') возвращает строку как есть, и поиск
      # контрагента по названию молча перестаёт работать. Проверяется тестом
      # TestDatabaseLocale.
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/init-db.sql:/docker-entrypoint-initdb.d/10-init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aerogram_migrator -d aerogram"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Почта в разработке никуда не уходит: письма видно в веб-интерфейсе.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  # Локальная замена S3 Selectel.
  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: aerogram
      MINIO_ROOT_PASSWORD: aerogram-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  redis-data:
  minio-data:

openapi: 3.1.0
info:
  title: Logistics OS API
  version: 1.0.0
  description: MVP API contract for multi-carrier B2B Logistics OS.
servers:
- url: https://api.example.com
  description: Production placeholder
security:
- bearerAuth: []
paths:
  /v1/auth/login:
    post:
      security: []
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /v1/rates:
    post:
      summary: Create rate quote
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RateRequest'
      responses:
        '200':
          description: Rate results including partial carrier failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateResponse'
  /v1/routing/quote:
    post:
      summary: Get recommendation for an existing quote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoutingRequest'
      responses:
        '200':
          description: Recommendation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recommendation'
  /v1/decisions:
    post:
      summary: Confirm human or automatic decision
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
      responses:
        '201':
          description: Decision snapshot created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResponse'
  /v1/shipments:
    get:
      summary: List shipments
      parameters:
      - name: status
        in: query
        schema:
          type: string
      - name: carrier_id
        in: query
        schema:
          type: string
          format: uuid
      - name: q
        in: query
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: page_size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      responses:
        '200':
          description: Shipment list
    post:
      summary: Create shipment from selected offer/decision
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShipmentRequest'
      responses:
        '201':
          description: Shipment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
  /v1/shipments/{shipment_id}:
    get:
      summary: Get shipment
      parameters:
      - $ref: '#/components/parameters/ShipmentId'
      responses:
        '200':
          description: Shipment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
  /v1/shipments/{shipment_id}/tracking:
    get:
      summary: Get normalized tracking timeline
      parameters:
      - $ref: '#/components/parameters/ShipmentId'
      responses:
        '200':
          description: Tracking
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TrackingEvent'
  /v1/carriers:
    get:
      summary: List connected carriers
      responses:
        '200':
          description: Carriers
  /v1/analytics/carriers:
    get:
      summary: Carrier score analytics
      responses:
        '200':
          description: Carrier analytics
  /v1/webhooks/{carrier_code}:
    post:
      security: []
      summary: Inbound carrier webhook
      parameters:
      - name: carrier_code
        in: path
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Accepted
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
    ShipmentId:
      name: shipment_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    Money:
      type: object
      required:
      - amount_minor
      - currency
      properties:
        amount_minor:
          type: integer
          description: Minor currency units; never float.
        currency:
          type: string
          minLength: 3
          maxLength: 3
    Address:
      type: object
      required:
      - country
      - city
      - address_line
      properties:
        country:
          type: string
        region:
          type: string
        city:
          type: string
        postal_code:
          type: string
        address_line:
          type: string
    Package:
      type: object
      required:
      - weight_grams
      properties:
        weight_grams:
          type: integer
          minimum: 1
        length_mm:
          type: integer
          minimum: 1
        width_mm:
          type: integer
          minimum: 1
        height_mm:
          type: integer
          minimum: 1
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    AuthResponse:
      type: object
      required:
      - access_token
      - expires_in
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
    RateRequest:
      type: object
      required:
      - origin
      - destination
      - packages
      - cargo_value
      - strategy
      properties:
        origin:
          $ref: '#/components/schemas/Address'
        destination:
          $ref: '#/components/schemas/Address'
        ship_at:
          type: string
          format: date-time
        deadline:
          type:
          - string
          - 'null'
          format: date-time
        packages:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Package'
        cargo_value:
          $ref: '#/components/schemas/Money'
        cargo_type:
          type: string
        additional_services:
          type: array
          items:
            type: string
        carrier_whitelist:
          type: array
          items:
            type: string
            format: uuid
        carrier_blacklist:
          type: array
          items:
            type: string
            format: uuid
        strategy:
          type: string
          enum:
          - optimal
          - cheapest
          - fastest
          - reliable
    CostComponent:
      type: object
      required:
      - type
      - money
      properties:
        type:
          type: string
          enum:
          - base
          - insurance
          - pickup
          - door_delivery
          - packaging
          - remote_area
          - pallet
          - waiting
          - declared_value
          - other
        money:
          $ref: '#/components/schemas/Money'
        rate_percent:
          type:
          - number
          - 'null'
        description:
          type: string
    RateOffer:
      type: object
      required:
      - id
      - carrier_id
      - service_code
      - source
      - total_cost
      - eligible
      properties:
        id:
          type: string
          format: uuid
        carrier_id:
          type: string
          format: uuid
        carrier_name:
          type: string
        service_code:
          type: string
        service_name:
          type: string
        source:
          type: string
          enum:
          - client_contract
          - logistics_os
        cost_components:
          type: array
          items:
            $ref: '#/components/schemas/CostComponent'
        total_cost:
          $ref: '#/components/schemas/Money'
        eta:
          type:
          - string
          - 'null'
          format: date-time
        deadline_margin_seconds:
          type:
          - integer
          - 'null'
        lateness_seconds:
          type:
          - integer
          - 'null'
        on_time_probability:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
        probability_label:
          type:
          - string
          - 'null'
          enum:
          - low
          - medium
          - high
          - null
        carrier_score:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 100
        risk:
          type:
          - string
          - 'null'
          enum:
          - low
          - medium
          - high
          - null
        confidence:
          type:
          - string
          - 'null'
          enum:
          - low
          - medium
          - high
          - null
        eligible:
          type: boolean
        ineligibility_reason:
          type:
          - string
          - 'null'
        valid_until:
          type:
          - string
          - 'null'
          format: date-time
    CarrierFailure:
      type: object
      properties:
        carrier_id:
          type: string
          format: uuid
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
    RateResponse:
      type: object
      required:
      - quote_id
      - offers
      - failures
      - no_deadline_match
      properties:
        quote_id:
          type: string
          format: uuid
        offers:
          type: array
          items:
            $ref: '#/components/schemas/RateOffer'
        failures:
          type: array
          items:
            $ref: '#/components/schemas/CarrierFailure'
        no_deadline_match:
          type: boolean
        valid_until:
          type: string
          format: date-time
    RoutingRequest:
      type: object
      required:
      - quote_id
      - strategy
      properties:
        quote_id:
          type: string
          format: uuid
        strategy:
          type: string
          enum:
          - optimal
          - cheapest
          - fastest
          - reliable
    Recommendation:
      type: object
      required:
      - id
      - quote_id
      - strategy
      - recommended_offer_id
      - algorithm_version
      properties:
        id:
          type: string
          format: uuid
        quote_id:
          type: string
          format: uuid
        strategy:
          type: string
        recommended_offer_id:
          type: string
          format: uuid
        explanation:
          type: array
          items:
            type: string
        algorithm_version:
          type: string
        policy_version:
          type: string
        alternatives_delta:
          type: object
          additionalProperties: true
    DecisionRequest:
      type: object
      required:
      - recommendation_id
      - selected_offer_id
      properties:
        recommendation_id:
          type: string
          format: uuid
        selected_offer_id:
          type: string
          format: uuid
        override:
          type: boolean
          default: false
        override_reason:
          type:
          - string
          - 'null'
        override_comment:
          type:
          - string
          - 'null'
        mode:
          type: string
          enum:
          - manual
          - auto
    DecisionResponse:
      type: object
      required:
      - decision_id
      - snapshot_id
      properties:
        decision_id:
          type: string
          format: uuid
        snapshot_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
    CreateShipmentRequest:
      type: object
      required:
      - decision_id
      properties:
        decision_id:
          type: string
          format: uuid
        external_id:
          type: string
    Shipment:
      type: object
      required:
      - id
      - status
      properties:
        id:
          type: string
          format: uuid
        external_id:
          type: string
        decision_id:
          type: string
          format: uuid
        carrier_id:
          type: string
          format: uuid
        tracking_number:
          type: string
        status:
          type: string
          enum:
          - Draft
          - Quoted
          - Created
          - PickedUp
          - InTransit
          - OutForDelivery
          - Delivered
          - Exception
          - Delayed
          - Cancelled
        eta:
          type:
          - string
          - 'null'
          format: date-time
        deadline:
          type:
          - string
          - 'null'
          format: date-time
        quoted_total_cost:
          $ref: '#/components/schemas/Money'
        actual_total_cost:
          oneOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
    TrackingEvent:
      type: object
      required:
      - occurred_at
      - normalized_status
      properties:
        occurred_at:
          type: string
          format: date-time
        normalized_status:
          type: string
        carrier_status:
          type: string
        location:
          type: string
        description:
          type: string

          description: "UID дополнительных услуг для доставки груза до адреса. Заполняется на основании [Справочника услуг ПРР](https://dev.dellin.ru/api/catalogs/directories/#_header11). Пользователь может одновременно заказать несколько дополнительных услуг, но не все имеющиеся доп. услуги. Стоимость доп. услуг включается в стоимости доставки от/до адреса" 
        arrivalFixedTimeVisit: 
          type: boolean
          description: "Фиксированное время доставки груза. Если передано значение 'true', то значение параметра 'arrivalPeriodVisit.end' игнорируется, вместо него используется значение ('arrivalPeriodVisit.start' + 30 минут). Значение по умолчанию: false. Параметр требует передачи в запросе arrivalPeriodVisit, иначе возникает ошибка: Требуется передать параметр 'arrivalperiodvisit'"
        arrivalUnLoading:
          type: array
          description: "Заказ разгрузки ТС. Содержит дополнительные параметры, необходимые для расчета погрузо-разгрузочных работ" 

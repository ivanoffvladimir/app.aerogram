    RequestConditionsRequest:
      type: object
      required: [appkey, blocks, volume, weight, deliveryType]
      properties:
        appkey:
          $ref: '#/components/schemas/AppKey'
        blocks:
          description: |-
            Cписок дополнительных услуг (предоставление которых может быть ограничено из-за условий заказа) по которым необходима информация.

            Доступные значения:
            
            - "day_to_day" – возможность передать груз водителю-экспедитору на адресе отправителя в день заказа;
            - "packages" – доступные упаковки (аналогично методу "Подбор упаковки");
            - "loadings" – доступные виды погрузки / дополнительные опции при погрузке;
            - "insurance" – услуга "Страхование срока доставки"
          type: array
          items:
            type: string
            enum:
              - day_to_day
              - packages
              - loadings
              - insurance
        derivalPoint:
          type: string
          description: |-
            Код КЛАДР пункта отправки груза. Может быть указан код КЛАДР города или улицы.
            
            *Обязательна передача одного из взаимоисключающих параметров: "derivalPoint" или "derivalSearch"
          example: "5500000100000000000000000"
        derivalSearch:
          type: string
          description: |-
            Адрес отправки груза в виде текста или координат.
            
            *Обязательна передача одного из взаимоисключающих параметров: "derivalPoint" или "derivalSearch"
          example:  "Омская обл., Омск, Ленина, 5"        
        arrivalPoint:
          type: string
          description: |-
            Код КЛАДР пункта прибытия груза. Может быть указан код КЛАДР города или улицы.
            
            *Обязательна передача одного из взаимоисключающих параметров: "arrivalPoint" или "arrivalSearch".Исключение: если параметр "blocks" содержит значение "day_to_day", то параметры "arrivalPoint" и "arrivalSearch" не учитываются, их передача необязательна
          example: "5900000100000000000000000"
        arrivalSearch:
          type: string
          description: |-
            Адрес доставки груза в виде текста или координат.
            
            *Обязательна передача одного из взаимоисключающих параметров: "arrivalPoint" или "arrivalSearch".Исключение: если параметр "blocks" содержит значение "day_to_day", то параметры "arrivalPoint" и "arrivalSearch" не учитываются, их передача необязательна
          example: "Пермский край, Пермь, ул. Якутская, д. 35"
        volume:
          type: number
          description: |-
            Объем груза, куб. м.
          example: 6
        weight:
          type: number
          description: |-
            Вес груза, кг
          example: 30
        length:
          type: number
          description: |-
            Длина груза, м
          example: 3
        width:
          type: number
          description: |-
            Ширина груза, м
          example: 2
        height:
          type: number
          description: |-
            Высота груза, м
          example: 1
        quantity:
          type: integer
          description: |-
            Количество грузовых мест. Значение по умолчанию – 1
          example: 2
        derivalTerminalID:
          type: integer
          description: |-
            ID терминала отправки груза из [Справочника терминалов
          example: 122
        arrivalTerminalID:
          type: integer
          description: |-
            ID терминала выдачи груза из Справочника терминалов
          example: 325
        deliveryType:
          type: integer
          description: |-
            ID вида доставки из [Справочника видов доставки](https://dev.dellin.ru/api/catalogs/directories/#_header12)
          example: 1
        derivalDoor:
          type: boolean
          description: |-
            Признак заказа доставки от адреса. Значение по умолчанию – "false"
          example: true
        arrivalDoor:
          type: boolean
          description: |-
            Признак заказа доставки до адреса. Значение по умолчанию – "false"
          example: true
      xml:
        name: request
        
    RequestConditionsResponse:
      type: object
      properties:
        day_to_day:
          type: object
          properties:
            same_day_pickup_ends_at:
              type: string
              format: time
              description: Время окончания приема заказов на передачу груза в день оформления
              example: '16:00:00'
            minimal_pickup_period:
              type: integer
              description: 'Минимальный срок между оформлением и передачей, в часах'
              example: 4
            same_day_pickup_allowed:
              type: boolean
              description: Возможность передачи груза в день оформления
              example: true
            terminal_id:
              type: integer
              description: ID терминала
              example: 58
            minimal_same_day_pickup_period:
              type: integer

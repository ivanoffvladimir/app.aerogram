  /v3/orders/change_receiver.{format}:
    post:
      tags:
        - Управление заказом
      summary: Изменение получателя по заказу
      description: |-
        [Сервис](https://dev.dellin.ru/api/order/change-receiver/) позволяет изменять получателя по уже оформленному заказу, при необходимости назначать его
        плательщиком по заказу, а также определять, кто берёт на себя расходы за платное хранение - отправитель, новый получатель или третье лицо.
  
        

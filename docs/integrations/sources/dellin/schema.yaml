              example: false
        handling:
          $ref: '#/components/schemas/DeliveryHandling'
        requirements:
          $ref: '#/components/schemas/Requirements'


    AdditionalAddress:
      type: object
      description: |-
          Заезд на второй адрес
          
          Параметр используется только для объекта "request.delivery.derival"
      properties:
        addressID:
          $ref: '#/components/schemas/AddressID'
        address:
          $ref: '#/components/schemas/Address'
        payer: 
          $ref: '#/components/schemas/Payer' 

#Авторизация      
    LoginRequest:
      required:
        - appkey
        - login
        - password
      type: object
      properties:
        appkey:
          $ref: '#/components/schemas/AppKey'
        login:
          type: string
          description: Логин от Личного кабинета.
          example: '+79999999999'
        password:
          type: string
          description: Пароль от Личного кабинета.
          example: password
      xml:
        name: request
        
    LoginResponse:
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/MetaData'
        data:
          type: object
          description: Данные сессии
          properties:
            sessionID:
              type: string
              description: ID сессии для запросов к данным Личного кабинета. Срок действия сессии - 30 дней
              example: 00000000-0000-0000-0000-000000000000
      xml:
        name: response
        
    V4LoginRequest:
      required:
        - appkey
        - pat
      type: object
      properties:
        appkey:
          $ref: '#/components/schemas/AppKey'
        pat:
          type: string
          description: Токен. Сгенерировать токен можно в личном кабинете сайта.
          example: dl-api-00000000000000000000000000000000000000
      xml:
        name: request

    LogoutSessionInfoRequest:
      required: [appkey, sessionID]
      type: object
      properties:
        appkey:
          $ref: '#/components/schemas/AppKey'
        sessionID:
          $ref: '#/components/schemas/SessionID'
      xml:
        name: request
        
    LogoutResponse:
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/MetaData'
        data:
          type: object
          description: Подтверждение успешности операции.
          properties:
            state:
              type: string
              description: Статус обработки запроса. Возможное значение – 'success' (операция успешно завершена)
              example: success
      xml:
        name: response
        
    SessionInfoResponse:
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/MetaData'
        data:
          type: object
          description: Данные сессии.
          properties:
            session:
              type: object
              description: Данные текущей сессии.
              properties:
                expireTime:
                  type: string
                  description: Дата окончания действия сессии.
                  example: '2014-04-12 18:01'
                expired:
                  type: boolean
                  description: Состояние сессии.
                  example: false
      xml:
        name: response


    CounteragentsRequest:
      required: [appkey, sessionID]
      type: object
      properties:
        appkey:
          $ref: '#/components/schemas/AppKey'
        sessionID:
          $ref: '#/components/schemas/SessionID'
        cauid:
          type: string
          description: 'UID контрагента, от имени которого должны создаваться заявки в рамках текущей сессии.'
          example: 00000000-0000-0000-0000-000000000000
        fullInfo:
          type: boolean
          description: 'Флаг, обозначающий, что запрошена полная информация по контрагентам, а также информация по взаиморасчётам.'
          default: false
      xml:
        name: request
        
    CounteragentsResponse:
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/MetaData'
        data:
          description: Данные по контрагентам.
          type: object
          properties:
            counteragents:
              description: Полный список доступных контрагентов.
              type: array
              items:
                properties:
                  balance:
                    type: object
                    description: 'Информация о движении денежных средств контрагента. Если взаиморасчетов не производилось, значение параметра – null. Параметр присутствует в ответе, только если в запросе метода был передан параметр "fullInfo" со значением "true"'
                    properties:
                      opening:
                        description: Баланс контрагента на начало периода.
                        allOf:
                          - $ref: '#/components/schemas/OpeningClosing'
                      closing:
                        description: 'Баланс контрагента на конец периода (или на текущий момент, если период не закрыт).'
                        allOf:
                          - $ref: '#/components/schemas/OpeningClosing'
                  info:
                    type: object
                    description: Полная информация о контрагентах.
                    properties:
                      sharedTo:
                        type: array
                        description: 'Данные пользователей, которым предоставлен доступ к учетной записи ЛК.'
                        items:
                          $ref: '#/components/schemas/ContactsData'
                      accessLevel:
                        type: integer
                        example: 2
                        description: |-
                          Уровень предоставленного доступа.
                          - 0 = запрос доступа
                          - 1 = запрос отклонён;
                          - 2 = полный доступ;
                          - 3 = частичный доступ
                      requestComment:
                        type: string
                        description: Комментарий при отклонении доступа.
                        example: null
                      managerEmail:
                        type: string
                        description: Электронная почта менеджера клиента.
                        example: Ivan.Ivanov@dellin.ru
                      managerPhone:
                        type: string
                        description: Контактный телефон менеджера клиента.
                        example: +7 (911) 232-95-50
                      sharedFrom:
                        description: 'Данные пользователя, который предоставил доступ к учетной записи ЛК.'
                        allOf:
                          - $ref: '#/components/schemas/ContactsData'
                      managerName:
                        type: string
                        description: ФИО менеджера клиента.
                        example: Иванов Иван Иванович
                  isCurrent:
                    type: boolean
                    description: 'Признак выбранного контрагента. Если в запросе был передан параметр "cauid", то в ответе у контрагента, UID которого был передан в запросе, значение параметра "isCurrent" будет равно "true"'
                    example: true
                  uid:
                    type: string
                    description: Уникальный идентификатор контрагента
                    example: 00000000-0000-0000-0000-000000000000
                  juridical:
                    type: boolean
                    description: |-
                      Признак юридического лица
                      Возможные значения:
                      - "true" – юридическое лицо;
                      - "false" – физическое лиц.

                      Параметр присутствует в ответе, только если в запросе метода был передан параметр "fullInfo" со значением "true"
                    example: true
                  inn:
                    description: 'ИНН (для юридических лиц), если контрагент является физическим лицо(значение параметра "juridical" – "false"), то значение параметра – null.Параметр присутствует в ответе, только если в запросе метода был передан параметр "fullInfo" со значением "true"'
                    type: string
                    example: 1234567890
                  document:
                    description: 'Данные документа, удостоверяющего личность (для физических лиц). Если контрагент является юридическим лицом (значение параметра "juridical" – "true"), то значение параметра – null.'
                    allOf:
                      - $ref: '#/components/schemas/DocumentPhisical'
                  name:
                    type: string
                    description: Имя/наименование контрагента
                    example: ООО "Компания"
                  cashOnDeliveryAvailable:
                    type: boolean
                    description: Признак возможности оформления контрагентом заказа с наложенным платежом
                    example: true
      xml:
        name: response

#Расчет стоимости       
    OpeningClosing:
      type: object
      properties:
        date:
          type: string
          format: date-time
          description: Дата начала/конца периода.
          example: '2015-06-18 12:37:28'
        sum:
          type: integer
          description: 'Сумма на начало/конец периода, руб.'
          example: 300
          
          
    ContactsData:
      type: object
      properties:
        phone:
          type: string
          description: Контактный телефон пользователя.
          example: +7 (111) 111-11-11
        name:
          type: string
          description: ФИО пользователя.
          example: ФИО
        email:
          type: string
          description: Электронная почта пользователя.
          example: ssidorov@dellin.ru
          
    V2CalculatorRequest:
      required: [cargo, delivery, appkey]    
      type: object
      description: Запрос расчета стоимости и сроков
      properties:
        appkey:
          $ref: '#/components/schemas/AppKey'
        sessionID:
          $ref: '#/components/schemas/SessionID'
        delivery:
          $ref: '#/components/schemas/V2CalculatorDelivery'
        members:
          $ref: '#/components/schemas/V2CalculatorMembers'
        cargo:
          $ref: '#/components/schemas/V2CalculatorCargo'
        payment:
          $ref: '#/components/schemas/V2CalculatorPayment'
      xml:
        name: request
        
    V2CalculatorDelivery:
      required: [arrival, deliveryType, derival]    
      type: object
      description: Информация по перевозке груза
      properties:
        deliveryType:
          $ref: '#/components/schemas/DeliveryType'
        arrival:
          $ref: '#/components/schemas/DeliveryArrivalV2Calculator'
        derival:
          $ref: '#/components/schemas/DeliveryDerivalV2Calculator'
        packages:
          type: array
          items:
            $ref: '#/components/schemas/V2CalculatorPackages'
        accompanyingDocuments:
          type: array
          items:
            $ref: '#/components/schemas/AcDoc'


        
    V2CalculatorMembers:
      type: object
      description: Участники перевозки
      properties:
        requester:
          $ref: '#/components/schemas/Requester'
          
    V2CalculatorCargo:
      type: object
      description: Информация о грузе
      properties:
        quantity:
          type: integer
          default: 1
          description: 'Количество грузовых мест, шт. Значение по умолчанию – "1".'
          example: 1
        length:
          type: number
          format: double
          minimum: 0
          description: 'Длина самого длинного грузового места, м.'
          example: 2
        width:
          type: number
          format: double
          minimum: 0
          description: 'Ширина самого широкого грузового места, м.'
          example: 1
        height:
          type: number
          format: double
          minimum: 0
          description: 'Высота самого высокого грузового места, м.'
          example: 1
        weight:
          type: number
          format: double
          minimum: 0
          description: 'Вес самого тяжелого грузового места, кг.'
          example: 100
        totalVolume:
          type: number
          format: double
          minimum: 0
          description: 'Общий объём груза, куб. м.'
          example: 1
        totalWeight:
          type: number
          format: double
          minimum: 0
          description: 'Общий вес груза, кг.'
          example: 100
        oversizedVolume:
          type: number
          format: double
          minimum: 0
          description: 'Вес негабаритных грузовых мест, кг'
          example: 1
        oversizedWeight:
          type: number
          format: double
          minimum: 0
          description: 'Объём негабаритных грузовых мест, куб. м'
          example: 1
        hazardClass:
          type: number
          format: double
          default: 0
          description: Класс опасности груза.
          example: 0
        insurance:
          $ref: '#/components/schemas/Insurance'
        freightUID:
          type: string
          maxLength: 34
          description: 'UID характера груза из справочника [Характер груза](https://dev.dellin.ru/api/catalogs/directories/#_header10). Для поиска UID по наименованию груза следует использовать сервис [Характер груза: поиск по строке (перевозка сборных грузов)](https://dev.dellin.ru/api/catalogs/freight-types/#_header2). '
          example: '0x82e6000423b423b711da7d15445d42cb'
          
    V2CalculatorPayment:
      required: [type]    
      type: object
      description: Оплата перевозки
      properties:
        paymentCity:
          type: string
          description: Код КЛАДР населённого пункта оплаты
          example: '7700000000000000000000000'
          externalDocs:
            url: 'https://dev.dellin.ru/api/places/kladr/'
            description: Поиск КЛАДР
        paymentCitySearch:
          type: object
          description: Данные по населённому пункту оплаты в виде произвольной строки
          properties:
            search:
              type: string
              maxLength: 1024
              minLength: 2
              example: Москва
              description: 'Населённый пункт в виде произвольной строки. Максимум – 1024 символа. Помимо наименования населённого пункта, в строке может быть передано наименование страны, региона, района – это позволит уточнить поиск и исключить ошибки, которые могут возникнуть из-за одинаковых названий населённых пунктов'
        type:
          $ref: '#/components/schemas/PaymentTypeEnum'
        promocode:
          type: string
          description: Промокод
          example: promo123

        
        
        
    V2CalculatorPackages:
      required: [uid]    
      type: object
      description: Данные по упаковке.
      properties:
        uid:
          type: string
          maxLength: 34
          description: 'Вид упаковки груза, UID упаковки'
          example: '0xa6a7bd2bf950e67f4b2cf7cc3a97c111'
          externalDocs:
            url: 'https://dev.dellin.ru/api/catalogs/directories/#_header9'
            description: Справочника дополнительных услуг
        count:
          type: integer
          minimum: 1
          description: |-
            Количество упаковок.
            Если выбрана упаковка "Упаковка мешок" или "Картонная коробка", то параметр является обязательным
          example: 1


        
        
        
    DeliveryArrivalV2Calculator:
      type: object
      description: Данные по доставке груза до получателя
      properties:
        variant:
          $ref: '#/components/schemas/DeliveryVariantArrival'
        terminalID:
          $ref: '#/components/schemas/TerminalID'
        addressID:
          $ref: '#/components/schemas/AddressID'
        address:
          $ref: '#/components/schemas/Address'
        time:
          $ref: '#/components/schemas/DeliveryWorkTime'
        handling:
          $ref: '#/components/schemas/DeliveryHandling'
        requirements:
          $ref: '#/components/schemas/Requirements'
        city:
          type: string
          description: Код КЛАДР города.
          example: '7800000000000000000000000'
          externalDocs:
            url: 'https://dev.dellin.ru/api/places/kladr/'
            description: Поиск КЛАДР
      required:
        - variant
        
    DeliveryDerivalV2Calculator:
      type: object
      description: Данные по доставке груза от отправителя
      properties:
        variant:
          $ref: '#/components/schemas/DeliveryVariantDerival'
        terminalID:
          $ref: '#/components/schemas/TerminalID'
        addressID:
          $ref: '#/components/schemas/AddressID'
        address:
          $ref: '#/components/schemas/Address'
        time:
          $ref: '#/components/schemas/DeliveryWorkTime'
        handling:
          $ref: '#/components/schemas/DeliveryHandling'
        requirements:
          $ref: '#/components/schemas/Requirements'
        produceDate:
          type: string
          format: date
          description: Дата передачи груза на терминал отправления или дата приезда машины к отправителю.
          example: '2019-11-08'
          externalDocs:
            url: 'https://dev.dellin.ru/api/catalogs/dispatch-dates/'
            description: Подбор даты отправки
      required:
        - variant
 
        
    PickupParams:
      type: object

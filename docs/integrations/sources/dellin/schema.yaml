      summary: Получение этикеток на груз по массиву заказов
      description: |-
        [Метод](https://dev.dellin.ru/api/marking/labels/#_header13) позволяет получить этикетки грузовых мест, если информация по грузовым местам была передана с помощью метода [Передача артикулов грузовых мест по массиву заказов](https://dev.dellin.ru/api/swagger/#/%D0%A1%D0%B0%D0%BC%D0%BE%D0%BC%D0%B0%D1%80%D0%BA%D0%B8%D1%80%D0%BE%D0%B2%D0%BA%D0%B0/v2_cargo_shipment_labels_batch).
        Отправлять запрос на получение этикеток следует после их формирования. Ожидаемое время формирования (с момента передачи информации по грузовым местам) зависит от количества грузовых мест в заказе:
        * до 500 грузовых мест – 15 с;
        * более 500 грузовых мест – по 15 с на каждую последующую группу из 500 грузовых мест, а также 15 с на оставшиеся грузовые места.
      operationId: v2_cargo_shipment_labels_get_batch
      parameters:
        - $ref: '#/components/parameters/format'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipmentLabelsGetBatchRequest'
          text/xml:
            schema:
              $ref: '#/components/schemas/ShipmentLabelsGetBatchRequest'
      responses:
        '200':
          description:  Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentLabelsGetBatchResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/ShipmentLabelsGetBatchResponse'
        '400': 
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                metadata:
                  status: 400
                  detail: abc
                  generated_at: '2025-06-09 13:13:43'
                errors:
                  - code: 180007
                    title: Недопустимое значение параметра
                    detail: Заказ не найден
                    link: https://dev.dellin.ru/api/errors/#error_180007
                    fields:
                      - orderIDs
              
            text/xml:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                metadata:
                  status: 400
                  detail: abc
                  generated_at: '2025-06-09 13:13:43'
                errors:
                  - code: 180007
                    title: Недопустимое значение параметра
                    detail: Заказ не найден
                    link: https://dev.dellin.ru/api/errors/#error_180007
                    fields:

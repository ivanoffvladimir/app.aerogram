    Error403:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: integer
              example: 403
            description:
              type: string
              example: "Отсутствует доступ к методу. Обратитесь в техническую поддержку."
    
    SuggestLKEDORequest:
      type: object
      required: [appkey, sessionID, role, counteragentType, name, inn]
      properties:
        appkey:      
          $ref: '#/components/schemas/AppKey' 
        sessionID:   
          $ref: '#/components/schemas/SessionID'
        role:
          type: string
          description: |-
            Роль адресата ЭПЭ в перевозке.
            Доступные значения:
            - "sender" – отправитель;
            - "receiver" – получатель;
            - "payer" – плательщик
          example: "sender"  
        counteragentType:
          type: string
          description: |-
            Тип контрагента
            Доступные значения:
            - juridical – юридическое лицо;
            - physical – физическое лицо;
            - individualEntrepreneur – ИП
          example: "juridical"
        name:
          type: string
          description: ФИО или наименование контрагента (без указания организационно-правовой формы). Максимум 1024 символа
          example: "ВИШНЯ"
        inn:
          type: string
          description: ИНН контрагента. Максимум 30 символов
          example: "7733640330"
        kpp:
          type: string
          description: КПП контрагента. Максимум 16 символов. *Параметр является обязательным, если контрагент – юридическое лицо (значение параметра "counteragentType" – "juridical")
          example: "123456879"

      xml: 
        name: request      

    SuggestLKEDOResponse:
      type: object
      xml:
        name: response
      properties:
        metadata:
          $ref: '#/components/schemas/MetaData'
        data:
          type: array
          items:
            $ref: '#/components/schemas/SuggestLKEDOItem'
    SuggestLKEDOItem:
      type: object
      properties:
        uid:
          type: string
          description: UID ЛК системы ЭДО
          example: '2BM-7707083893-776301001-201401201117022305126'
        operatorCode:
          type: string
          description: Код оператора ЭДО
          example: diadoc
        operatorName:
          type: string
          description: Наименование оператора ЭДО
          example: Контур.Диадок
        isAvailableForDocType:
          type: boolean
          description: Возможность работы с ЭПЭ
          example: true

#Журнал заказов

    V3OrdersRequest:
      type: object
      required:
        - appkey
      properties:
        appkey:
          $ref: "#/components/schemas/AppKey"
        sessionID:
          $ref: "#/components/schemas/SessionID"
        docIds:
          type: array
          description: |-
            Номер заказа, накладной или заявки. Возможна передача нескольких параметров. Максимум может быть передано 5 значений.
            
            *Параметр используется для поиска заказа. Если в запросе отсутствует параметр "sessionID", то в нём должен присутствовать один из следующих параметров: "docIds", "orderNumber" или "barcode"
          minItems: 1
          items:
            type: string
          example:
            - "19-00085281151"
            - "19-00085281152"
        orderNumber:
          type: string
          description: |-
            Внутренний номер заказа клиента (например, номер заказа интернет-магазина).
            
            *Параметр используется для поиска заказа. Если в запросе отсутствует параметр "sessionID", то в нём должен присутствовать один из следующих параметров: "docIds", "orderNumber" или "barcode"
          example: "Т1234567889"
        orderDate:
          type: string
          format: date
          description: |-
            Дата заказа интернет-магазина. Формат: "ГГГГ-ММ-ДД"
          example: "2025-06-02"
          
        barcode:
          type: string
          format: date
          description: |-
            Штрих-код, считанный сканером.

            Для поиска заказа могут быть использованы следующие штрих-коды:
            
            - штрих-код накладной;
            - штрих-код накладной экспедитора (документ используется водителем-экспедитором при получении груза на адресе отправителя);
            - штрих-код заявки на доставку груза, оформленной при размещении предзаказа;
            - штрих-код, считанный с этикетки на грузе (код документа "Накладная" с указанием грузоместа).
            
            *Параметр используется для поиска заказа. Если в запросе отсутствует параметр "sessionID", то в нём должен присутствовать один из следующих параметров: "docIds", "orderNumber" или "barcode"
          example: "1345678"
          
        cargoPlaces:
          type: array
          description: |-
            Массив номеров грузовых мест.
            
            *Параметр используется для поиска заказа авторизованными пользователями (может быть передан, только если в запросе присутствует параметр "sessionID").
            
            __Поиск производится только по первому значению, переданному в массиве.__
            
            __В запросе может быть передан только один из параметров: "docIds", "orderNumber", "barcode", "cargoPlaces", "shipmentLabelCargoPlace"__
          items:
            type: string
          example:
            - "3252235"
            
        shipmentLabelCargoPlace:
          type: string
          description: |-
            Артикул грузового места.

            *Параметр используется для поиска заказа авторизованными пользователями (может быть передан, только если в запросе присутствует параметр "sessionID").
            
            Чтобы иметь возможность искать заказы по артикулу грузового места, необходимо сначала передать информацию о грузовых местах при помощи метода "Передача артикулов грузовых мест".
            
            Пользователи с ограниченным доступом могут осуществлять поиск только по тем заказам, где они выступают в роли заказчика, пользователи с полным доступом – по всем заказам, независимо от роли (подробнее о доступе см. метод "Список контрагентов", описание параметра ответа "info.accessLevel").
            
            Если заказана доставка груза от адреса отправителя и груз ещё не был принят к перевозке на терминале компании, то информация по грузу доступна только тому пользователю, который оформил заказ
          example: "Артикул1223657"


        sender:
          type: string
          description: |-
            Отправитель
          example: "ООО Ромашка"
          
        receiver:
          type: string
          description: |-
            Получатель
          example: "ИП Иван Иванович"
          
        derivalCity:
          type: string
          description: |-
            Откуда. Полное наименование города из справочника [Населенных пунктов](https://dev.dellin.ru/api/swagger/#/%D0%A1%D0%BF%D1%80%D0%B0%D0%B2%D0%BE%D1%87%D0%BD%D1%8B%D0%B5%20%D0%BC%D0%B5%D1%82%D0%BE%D0%B4%D1%8B/public_places)
          example: "Новосибирск г (Новосибирская обл.)"          

        arrivalCity:
          type: string
          description: |-
            Куда. Полное наименование города из справочника [Населенных пунктов](https://dev.dellin.ru/api/swagger/#/%D0%A1%D0%BF%D1%80%D0%B0%D0%B2%D0%BE%D1%87%D0%BD%D1%8B%D0%B5%20%D0%BC%D0%B5%D1%82%D0%BE%D0%B4%D1%8B/public_places)
          example: "Омск г (Омская обл.)"

        isPaid:
          type: boolean
          description: |-
            Признак оплаты. Доступные значения:

            - true - только оплаченные
            - false - только неоплаченные заказы
            Если передано пустое значение - выводятся все заказы (оплаченные и неоплаченные)
          example: true 
          
          
        dateStart:
          type: string
          description: |-
            Начальная дата и время периода (для фильтрации результатов поиска по периоду создания заказа).
            
            Формат: "ГГГГ-ММ-ДД ЧЧ:ММ:СС".
            
            Значение параметра учитывается, только если в запросе есть параметр "sessionID", но нет параметров "docIds", "orderNumber", "barcode", "cargoPlaces" или "shipmentLabelCargoPlace"
          example: "2025-04-11 10:10"  
          
        dateEnd:
          type: string
          description: |-
            Конечная дата и время периода (для фильтрации результатов поиска по периоду создания заказа. Учитывается при указании параметра "dateStart").
            
            Формат: "ГГГГ-ММ-ДД ЧЧ:ММ:СС".
            
            Значение параметра учитывается, только если в запросе есть параметр "sessionID", но нет параметров "docIds", "orderNumber", "barcode", "cargoPlaces" или "shipmentLabelCargoPlace"
          example: "2025-05-12 10:10"
          
        states:
          type: array
          description: |-
            Список статусов, заказы с которыми надо получить в ответе. Статусы указываются на основании справочника [Статусы заказа груза](https://dev.dellin.ru/api/catalogs/directories/#_header32).
            
            Значение параметра учитывается, только если в запросе есть параметр "sessionID", но нет параметров "docIds", "orderNumber", "barcode", "cargoPlaces" или "shipmentLabelCargoPlace"
          items:
            type: string
          example:
            - "pickup"
            
        page:
          type: integer
          description: |-
            Номер запрашиваемой страницы ответа
          example: 1
          
        lastUpdate:
          type: string
          description: |-
            Фильтр для поиска заказов, изменившихся в период, начиная с указанного в данном параметре момента времени.
            
            Формат: "ГГГГ-ММ-ДД ЧЧ:ММ:СС".
            
            Значение параметра учитывается, только если в запросе есть параметр "sessionID", но нет параметров "docIds", "orderNumber", "barcode", "cargoPlaces" или "shipmentLabelCargoPlace".
            
            Если в запросе передан параметр "states" со значением "inway", то в ответ будут включены все заказы в статусе "inway", независимо от значения параметра "lastUpdate" (для прочих статусов действует иная логика: в ответ включаются заказы в указанных статусах, обновлённые после даты, переданной в параметре "lastUpdate")
          example: "2025-05-12 10:10" 

        orderBy:
          type: string
          description: |-
            Сортировка заказов.

            Возможные значения:
            
            - ordered_at – по дате заказа;
            - updated_at – по дате обновления.
            
            Значение параметра учитывается, только если в запросе есть параметр "sessionID", но нет параметров "docIds", "orderNumber", "barcode", "cargoPlaces" или "shipmentLabelCargoPlace"
          example: "ordered_at" 

        orderDatesAdditional:
          type: boolean
          description: Флаг, обозначающий, что необходима информация о промежуточных точках маршрута перевозки
          example: true
          
      xml: 
        name: request
    
    V3OrdersResponse:
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/MetaDataOrders'
        orders:
          type: array
          items:
            $ref: '#/components/schemas/Orders'
        information:
          type: array
          items:
            $ref: '#/components/schemas/Information'
        deleted:
          description: Список удалённых заказов (при передаче в запросе параметра request.lastUpdate)
          type: array
          items:
            type: string
              
    MetaDataOrders:
      type: object
      properties:
        status:
          type: integer
          description: Эмуляция http-кода состояния. В случае успешного выполнения возвращается код "200" (OK)
          example: 200
        currentPage:
          type: integer
          description: Номер текущей страницы ответа
          example: 1
        nextPage:
          type: integer
          description: Номер следующей страницы ответа
          example: 2
        prevPage:
          type: integer
          description: Номер предыдущей страницы ответа. Если номер текущей страницы ответа – "1", то значение данного параметра – "null"
          example: null
        totalPages:
          type: integer
          description: Страниц всего
          example: 41     
        generatedAt:
          type: string
          description: |-
            Дата и время генерации ответа сервера. Формат: "ГГГГ-ММ-ДД ЧЧ:ММ:СС"
          example: "2025-06-01 13:24:54" 
        
          

    Orders:
      type: object
      properties:
        orderNumber:
          type: string
          description: |-
            Внутренний номер заказа клиента (например, номер заказа интернет-магазина)
          example: null
        orderDate:
          type: string
          description: |-
            Дата заказа интернет-магазина
          example: null
        orderId:
          type: string
          description: |-
            Номер заказа
          example: "400275691"
        orderedAt:
          type: string
          description: |-
            Дата создания заказа
          example: "2025-06-01 08:36:27"
        state:
          type: string
          description: |-
            Статус заказа на английском языке (см. справочник [Статусы заказа груза](https://dev.dellin.ru/api/catalogs/directories/#_header32))
          example: "inway"
        stateName:
          type: string
          description: |-
            Статус заказа на русском языке (см. справочник [Статусы заказа груза](https://dev.dellin.ru/api/catalogs/directories/#_header32))
          example: "Груз в пути"
        stateDate:
          type: string
          description: |-
            Дата установки текущего статуса. Формат: "ГГГГ-ММ-ДД".

            Если статус заказа – "Черновик" или "В обработке" (значение параметра ответа "orders.state" – "draft" или "processing"), то значение параметра – null
          example: "2025-06-01"
          
        returnState:
          type: boolean
          description: |-
            Признак возвратного груза
          example: "true"
        returnReason:
          type: string
          description: |-
            Причина возврата груза
          example: "Отказ после выдачи"
        returnDate:
          type: string
          description: |-
            Дата и время установки признака возвратного груза
          example: "2025-06-15 12:30:17"
        progressPercent:
          type: integer
          description: |-
            Степень выполнения заказа (в процентах). Значение параметра может быть использовано для визуализации хода выполнения заказа 
          example: "15"
        derival:
          $ref: '#/components/schemas/V3OrdersDerivalArrival'   
        arrival:
          $ref: '#/components/schemas/V3OrdersDerivalArrival'   
        brandUid:
          type: string
          description: |-
            UID бренда в заказе
          example: "0xa6a926848ff680ac4c33255c700a6383"
        sender:
          $ref: '#/components/schemas/V3OrdersMembers' 
        receiver:
          $ref: '#/components/schemas/V3OrdersMembersReceiver' 
        payer:
          $ref: '#/components/schemas/V3OrdersMembers' 
        freight:
          $ref: '#/components/schemas/V3OrdersFreight' 
        cargoPlaces:
          type: array
          items:
            $ref: '#/components/schemas/V3OrderscargoPlaces'
                 
        isAir:
          type: boolean
          description: |-
            Признак авиаперевозки
          example: "false"
        air:
          $ref: '#/components/schemas/V3OrdersAir'  
        locks:
          type: array
          items:
            $ref: '#/components/schemas/Locks'
          description: |-
            Массив блокировок по заказу
          
          
        webOrderItemsSum:
          type: number
          description: Сумма наложенного платежа

          
        withWebOrder:
          type: boolean
          description: |-
            Признак наложенного платежа
          example: "true"
        totalSum:
          type: string
          description: |-
            Общая сумма заказа
          example: "7644.0"
        vat:
          type: string
          description: НДС
          example: "1171.33"
        isPaid:
          type: boolean
          description: |-
            Статус оплаты заказа.
            
            Возможные значения:
            
            true – по заказу нет накладных или есть накладные без долгов по ним;
            false – по заказу есть накладные с долгом
          example: "false"
        isPreorder:
          type: boolean
          description: Флаг, обозначающий что заказ является предзаказом
          example: "false"
        produceDate:
          type: string
          description: |-
            Дата выполнения заказа. Данные недоступны при заказе услуги "Мультиотправка"
          example: "2025-06-01"
        declineReason:
          type: string
          description: |-
            Причина отклонения. Данные доступны, только если заказ был отклонён
          example: null
        orderDates:
          $ref: '#/components/schemas/V3OrdersOrderDates'  
        orderTimeInDays:
          description: |-
            Расчетные сроки доставки от терминала до адреса в днях. Данные доступны, если значение параметра "isAir" = "false". В противном случае значения всех вложенных параметров данного объекта будут содержать "null"
          type: object
          properties:
            delivery:
              type: integer
              description: |-
                Срок доставки груза.

                Отсчитывается от даты, пришедшей в параметре "orderDates.derivalFromOspReceiver".
                
                Информация присутствует в ответе, если заказана доставка до адреса и отсутствует дата доставки груза до адреса (см. описание параметра ответа "orders.orderDates.arrivalToReceiver")
            deliveryAccdoc:
              type: integer
              description: |-     
                Срок доставки сопроводительных документов.
  
                Отсчитывается от даты, пришедшей в параметре "orderDates.derivalFromOspReceiverAccdoc"
                


            
        orderedDeliveryFromAddress:
          type: boolean
          description: |-
            Флаг, обозначающий что заказана доставка от адреса отправителя
          example: "true"
        availableDeliveryFromAddress:
          type: boolean
          description: |-
            Флаг, обозначающий что возможна доставка от адреса отправителя
          example: "true"
        orderedDeliveryToAddress:
          type: boolean
          description: |-
            Флаг, обозначающий что заказана доставка до адреса получателя
          example: "true"
        availableDeliveryToAddress:
          type: boolean
          description: |-
            Флаг, обозначающий что возможна доставка до адреса получателя
          example: "true"
        isFavorite:
          type: boolean
          description: |-
            Признак избранного заказа
          example: "true"
        isContainer:
          type: boolean
          description: |-
            Флаг контейнерной перевозки
          example: "true"
        sfrequest:
          type: object
          description: |-
            Информация по заявке на доставку до адреса получателя
          properties:
            cityID:
              type: integer
              description: |-
                ID города доставки, см. метод [Поиск населённых пунктов](https://dev.dellin.ru/api/places/search/)
            docNumber:
              type: string
              description: |-     
                Номер накладной доставки
            price:
              type: string
              description: |-     
                Стоимость доставки
        documents:
          type: array
          description: |-
            Массив документов заказа
          items: 
            $ref: '#/components/schemas/Documents'
        orderDatesAdditional:
          $ref: '#/components/schemas/V3OrdersOrderDatesAdditional'
        detailedStatus:
          type: string
          description: |-
            Дополнительный статус заказа на английском языке.

            Возможные значения (порядок соответствует порядку возможных значений параметра "detailedStatusRus"):
            
            - "pickup_waiting_pickup";
            - "pickup_departed";
            - "pickup_arrived";
            - "pickup_arrived_at_first";
            - "pickup_arrived_at_last";
            - "pickup_finished";
            - "delivery_waiting_delivery";
            - "delivery_departed";
            - "delivery_arrived";
            - "delivery_finished";
            - "delivery_delivered"
          example: null
          
        detailedStatusRus:
          type: string
          description: |-
            Дополнительный статус заказа на русском языке.

            Возможные значения (порядок соответствует порядку возможных значений параметра "detailedStatus"):
            
            - "Ожидается забор" – водитель ещё не выехал на адрес отправителя;
            - "Машина едет на адрес";
            - "Машина на адресе";
            - "Прибыл на первый адрес";
            - "Прибыл на последний адрес";
            - "Груз забран. Едет на терминал";
            - "Ожидается доставка" – водитель ещё не выехал на адрес получателя;
            - "Машина едет на адрес";
            - "Машина на адресе";
            - "Груз доставлен" (соответствует значениям "delivery_finished" и "delivery_delivered" параметра "detailedStatus")
          example: null
          
        note:
          type: string
          description: |-
            Комментарий к заказу. Пользователь может оставить комментарий к заказу в личном кабинете на сайте компании "Деловые Линии" 
          example: null
        documentsReturnDate:
          type: string
          description: |-
            Ориентировочная дата возврата сопроводительных документов.
          example: null
        priceComment:
          type: string
          description: |-
            Комментарий, свидетельствующий о том, что информация о стоимости заказа недоступна текущему пользователю
          example: " "
        customerUid:
          type: string
          description: |-
            UID заказчика по заявке. Данные присутствуют в ответе, только если у пользователя есть полный доступ к контрагенту (см. метод "Список контрагентов", описание параметра ответа "info.accessLevel")
          example: "00000000-0000-0000-0000-000000000000"
        acceptanceActs:
          type: array
          items: 
            $ref: '#/components/schemas/AcceptanceActs'   
        statedValue:
          type: number
          format: float
          description: |-
            Объявленная стоимость груза
          example: 9999.99
        shipmentLabelCargoPlace:
          type: string
          description: |-
            Артикул грузового места
          example: "Артикул1223657"

    V3OrdersOrderDates:
      type: object
      properties:
        arrivalToOspReceiver:
          type: string
          description: |-  
            Дата прибытия груза на терминал-получатель
        arrivalToOspReceiverMax:
          type: string
          description: |-   
            Максимальная дата прибытия груза на терминал-получатель (в случае, если возможно увеличение срока прибытия)
        arrivalToOspReceiverAccdoc:
          type: string
          description: |-    
            Дата прибытия сопроводительных документов на терминал-получатель
        arrivalToOspSender:
          type: string
          description: |-  
            Дата прибытия груза на терминал-отправитель
        arrivalToReceiver:
          type: string
          description: |-
            Дата доставки груза до адреса:

            - фактическая – для доcтавленных заказов (значение параметра ответа "orders.stateName" – "Заказ завершен", "Груз выдан. Возврат СД");
            - расчётная – для заказов, принятых к перевозке, но ещё не доставленных.
            При отсутствии расчётной даты доставки, в ответе метода содержится расчётный срок доставки см. описание параметра ответа "orders.orderTimeInDays.delivery"
        declineDate:
          type: string
          description: |-    
            Дата отклонения. В отдельных случаях данные могут отсутствовать
        derivalFromOspReceiver:
          type: string
          description: |-    
            Дата отправки с терминала-получателя
        derivalFromOspReceiverMax:
          type: string
          description: |-    
            Максимальная дата отправки с терминала-получателя (в случае, если возможно увеличение срока отправки)
        derivalFromOspReceiverAccdoc:
          type: string
          description: |-    
            Дата отправки сопроводительных документов с терминала-получателя
        giveoutFromOspReceiver:
          type: string
          description: |-   
            Ориентировочная дата готовности груза к выдаче на терминале-получателе
        giveoutFromOspReceiverMax:
          type: string
          description: |-    
            Максимальная дата готовности груза к выдаче на терминале-получателе (в случае, если возможно увеличение срока готовности)
        derivalFromOspSender:
          type: string
          description: |-
            Дата отправления груза с терминала-отправителя
        draftLastUpdate:
          type: string
          description: |-   
            Дата последнего сохранения черновика
        finish:
          type: string
          description: |-     
            Дата исполнения заказа
        firstDocumentCreatedDate:
          type: string
          description: |-       
            Дата создания первого документа по заказу
        pickup:
          type: string
          description: |-
            Дата передачи груза на адресе отправителя
        processingDate:
          type: string
          description: |-     
            Дата отправки заявки в обработку
        warehousing:
          type: string
          description: |-     
            Дата начала платного хранения

    V3OrdersOrderDatesAdditional:
      type: object
      properties:
        tracing:
          $ref: '#/components/schemas/Tracing'          
        
    Tracing:
      type: object
      properties: 
        title:
          type: string
          description: |-
              Событие, дата которого передаётся в параметре "tracing.date". Значение всегда "Отбытие из ОСП"
          example: "Отбытие из ОСП"
        date:
          type: string
          description: |-
              Дата прохождения точки маршрута. Формат: "ГГГГ-ММ-ДД"
          example: "2020-10-01"
        cityUID:
          type: string
          description: |-
              UID города (промежуточной точки маршрута)
          example: "0x834f00112fdd658311da4c6326ef0e0e"          
        cityName:
          type: string
          description: |-
              Город (промежуточная точка маршрута)
          example: "Волгоград"            
        status:
          type: string
          description: |-
              Статус заказа на момент прохождения точки маршрута. Значение всегда "inway" (см. справочник [Статусы заказа груза](https://dev.dellin.ru/api/catalogs/directories/#_header32)
          example: "inway"          
                   
    V3OrdersAir:
      type: object
      properties:
        arrivalDate:
          type: string
          description: |-
              Фактическая дата прибытия груза при доставке авиатранспортом
          example: "2020-10-01"
        giveoutDate:
          type: string
          description: |-
              Дата выдачи груза при доставке авиатранспортом
          example: "2020-10-01"
        warehousingDate:
          type: string
          description: |-
              Дата начала платного хранения при доставке авиатранспортом
          example: "2020-10-06"          
        deliveryDate:
          type: string
          description: |-
              Ориентировочная дата прибытия груза при доставке авиатранспортом
          example: "2020-10-01"            
        comment:
          type: string
          description: |-
              Комментарий
          example: "комментарий"          
        orderId:
          type: string
          description: |-
              Номер авианакладной
          example: "123-12312323"          
        

    V3OrderscargoPlaces:
      type: object
      properties:
        number:
          type: string
          description: |-
              Номер грузового места
          example: 3252235
        amount:
          type: integer
          description: |-
            Количество грузовых мест с идентичным номером
          example: 1   
    AcceptanceActs:
        type: object
        properties:
          acceptanceActNumber:
            type: string
            description: Номер.
          acceptanceActDate:
            type: string
            description: Дата.
          acceptanceActType:
            type: string
            description: |-
              Тип. Возможные значения:
              - Корректировочный;
              - Исправленный
              В случае обычного счёта-фактуры параметр приходит пустым 

    V3OrdersDerivalArrival:
      type: object
      properties:
        city:
          type: string
          description: |-
            Город отправки/доставки груза
          example: null
        cityId:
          type: integer
          description: |-
            ID города отправления/прибытия
          example: " "
        cityCode:
          type: string
          description: |-
            Код КЛАДР города, см. [Поиск населённых пунктов](https://dev.dellin.ru/api/places/search/)
          example: "00000000-0000-0000-0000-000000000000"
        address:
          type: string
          description: |-
            Адрес отправки/доставки груза
          example: "2236748596"
        addressCode:
          type: string
          description: |-
            Код КЛАДР улицы, см. [Поиск улиц](https://dev.dellin.ru/api/places/search/)
          example: "Артикул1223657"
        terminalName:
          type: string
          description: |-
            Наименование терминала хранения
          example: null
        terminalAddress:
          type: string
          description: |-
            Адрес терминала хранения
          example: " "
        terminalId:
          type: integer
          description: |-
            ID терминала-отправителя/получателя из [Справочника терминалов](https://dev.dellin.ru/api/terminals/directory/)
          example: "00000000-0000-0000-0000-000000000000"
        terminalCity:
          type: string
          description: |-
            Город терминала хранения (1)
          example: "2236748596"
          
        terminalCoordinates:
          type: array
          items:
            type: number
            format: float
            
            
          description: |-
            Долгота и широта терминала хранения 
          example: "Артикул1223657"
        terminalEmail:
          type: string
          description: |-
            Email терминала хранения (1)
          example: "Артикул1223657"
        terminalPhones:
          type: string
          description: |-
            Email терминала хранения (1)
          example: null
        callCenterPhones:
          type: string
          description: |-
            Телефон кол-центра (1)
          example: " "
        timeEnd:
          type: string
          description: |-
            Время окончания доставки от/до адреса
          example: "18:01:01"
        timeStart:
          type: string
          description: |-
            Время начала доставки от/до адреса 
          example: "09:01:01"
        driver:
          $ref: '#/components/schemas/Driver'            

            
        vehicle:
          $ref: '#/components/schemas/Vehicle'  
          
          
        terminalWorktables:
          $ref: '#/components/schemas/TerminalWorktables'

        specialWorktable:
          $ref: '#/components/schemas/SpecialWorktable'

    Driver:
      description: |-
        Информация о водителе 
      type: object
      properties:
        driverName:
          type: string
          description: |-
            ФИО водителя
          example: "Иванов Иван Иванович"
        driverPhone:
          type: string
          description: |-
            Телефон водителя
          example: "+7 (999) 999-88-88"


    Vehicle:
      description: |-
        Информация о транспортном средстве водителя
      type: object
      properties:
        vehicleType:
          type: string
          description: |-
            Тип транспортного средства
          example: "Газель"
        vehicleLicencePlate:
          type: string
          description: |-
            Номер транспортного средства
          example: "О 532 УК 199"

    TerminalWorktables:
      description: |-
        График работы терминала хранения (график выдачи груза) (1)
      type: object
      properties:
        sun:
          type: string
          description: |-
            График работы терминала хранения в воскресенье
          example: "11:00-16:00"
        mon:
          type: string
          description: |-
            График работы терминала хранения в понедельник
          example: "09:00-16:00"
        tue:
          type: string
          description: |-
            График работы терминала хранения во вторник
          example: "09:00-18:00"
        wed:
          type: string
          description: |-
            График работы терминала хранения в среду
          example: "09:00-18:00"
        thu:
          type: string
          description: |-
            График работы терминала хранения в четверг
          example: "09:00-18:00"
        fri:
          type: string
          description: |-
            График работы терминала хранения в пятницу
          example: "09:00-18:00"
        sat:
          type: string
          description: |-
            График работы терминала хранения в субботу
          example: "09:00-18:00"
        
    SpecialWorktable:
      description: |-
        График работы терминала хранения в праздничные дни (1)
      type: object
      properties:    
        receive:
          description: |-
              График работы терминала хранения на прием груза (в праздничные дни)
          type: array
          items:
            type: string
        giveout:
          description: |-
              График работы терминала хранения на выдачу груза (в праздничные дни)
          type: array
          items:
            type: string
        
        
    Locks:
      description: |-
        Массив блокировок по заказу
      type: object
      properties: 
        name:
          type: string
          description:   Наименование блокировки
        type:
          type: string
          description: Тип блокировки
        setDate:
          type: string
          description: Дата установки блокировки
        endDate:
          type: string
          description: Дата снятия блокировки
          
    Documents:
      description: |-
        Массив документов заказа
      type: object
      properties: 
        id:
          type: integer
          description:   Номер документа
        uid:
          type: string
          description: UID накладной
        type:
          type: string
          description: |-
          
            Тип документа.
            
            Возможные значения:
            
            - "shipping" – накладная;
            - "request" – заявка на доставку груза (от адреса отправителя или от терминала);
            - "request_sf" – заявка на доставку до адреса получателя (от терминала);
            - "request_ftl" – заявка на междугороднюю перевозку выделенной еврофурой
        createDate:
          type: string
          description: Дата создания документа
        state:
          type: string
          description: |-
            Статус документа. У заявки на доставку от адреса отправителя/до адреса получателя/на междугороднюю перевозку выделенной еврофурой (значение параметра "response.orders.documents.type" – "request"/"request_sf"/"request_ftl") могут быть следующие статусы:

            - "temporary" – заявка не заполнена;
            - "saved" – черновик;
            - "ordered" – заявка в очереди на обработку;
            - "loaded" – заявка взята на обработку;
            - "processed" – заявка обработана;
            - "declined" – заявка отклонена;
            - "accepted" – заявка принята;
            - "canceled" – заявка отменена.
            Для накладной (значение параметра "response.orders.documents.type" – "shipping") статус присутствует в ответе, но не используется (всегда имеет значение "in_way")
        freightDirection:
          type: string
          description: |- 
            Направление потока перевозки груза. Возможные значения:

            - straight – основная накладная прямого потока;
            - straightAdditional – дополнительная накладная прямого потока;
            - return – основная накладная возвратного потока;
            - returnAdditional – дополнительная накладная возвратного потока;
            - null – направление не определено (возвращается для всех накладных по заказу без возврата груза)
        sender:
          $ref: '#/components/schemas/V3OrdersDocumentsMembers'
        receiver:
          $ref: '#/components/schemas/V3OrdersDocumentsMembers'
        payer:
          $ref: '#/components/schemas/V3OrdersDocumentsMembers'
        produceDate:
          type: string
          description: Дата исполнения заявки         

        forwarderId:
          type: string
          description: Номер заявки экспедитора
        comment:
          type: string
          description: Комментарии к документам
        fullDocumentId:
          type: string
          description: Полный номер документа
        freight:
          $ref: '#/components/schemas/DocumentsFreight'
        derival:
          description: Информация о месте отправки
          type: object
          properties:
            name:
              type: string
              description: Город
            code:
              type: string
              description: Код КЛАДР города, см. метод [Поиск населённых пунктов](https://dev.dellin.ru/api/places/search/) 
        arrival:
          description: Информация о месте получения
          type: object
          properties:
            name:
              type: string
              description: Город
            code:
              type: string
              description: Код КЛАДР города, см. метод [Поиск населённых пунктов](https://dev.dellin.ru/api/places/search/)       
              
        barcode:
          type: string
          description:  |-
            Barcode для формирования штрих-кода по алгоритму [Code 128](https://ru.wikipedia.org/wiki/Code_128) (для заявки на [предзаказ](https://www.dellin.ru/articles/176/))
        payment:
          type: string
          description: Статус оплаты
        totalSum:
          type: number
          format: float
          description: Общая сумма по накладной
        vat:
          type: string
          description: НДС
        serviceKind:
          type: string
          description: Тип перевозки
        organization:

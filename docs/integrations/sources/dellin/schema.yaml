                $ref: '#/components/schemas/Error'
              example:
                metadata:
                  status: 400
                  detail: abc
                  generated_at: '2025-06-09 13:13:43'
                errors:
                  - code: 180007
                    title: Недопустимое значение параметра
                    detail: Заказ не найден
                    link: https://dev.dellin.ru/api/errors/#error_180007
                    fields:
                      - orderID
              
            text/xml:
              schema:
                $ref: '#/components/schemas/Error'
              example:

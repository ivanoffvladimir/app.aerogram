                  detail: abc
                  generated_at: '2025-05-30 13:02:13'
                errors:
                  - code: 616001
                    title: Указанные заказы не соответствуют условиям группировки в мультизаявку
                    link: https://dev.dellin.ru/api/ordering/pre-alert/#error_616001
                    fields:
                      - requestIDs
                    bad_values:
                      - 1111
                      - 2222

    RequestTerminalsResponse:
      type: object
      properties:
        terminals:
          type: array
          items:
            $ref: '#/components/schemas/TerminalItem'
      description: Массив терминалов, удовлетворяющих фильтру 
      xml:
        name: response
        

    TerminalItem:
      type: object
      properties:
        id:        
          type: integer 
          description: |- 
            ID терминала из [Справочника терминалов](https://dev.dellin.ru/api/swagger/#/%D0%A2%D0%B5%D1%80%D0%BC%D0%B8%D0%BD%D0%B0%D0%BB%D1%8B/public_terminals)
          example: 15
        city:      
          type: string
          description: |- 
            Название города терминала
          example: "Санкт-Петербург"
        cityID:     
          type: integer
          description: |- 
            ID города терминала из [Справочника населенных пунктов](https://dev.dellin.ru/api/swagger/#/%D0%A1%D0%BF%D1%80%D0%B0%D0%B2%D0%BE%D1%87%D0%BD%D1%8B%D0%B5%20%D0%BC%D0%B5%D1%82%D0%BE%D0%B4%D1%8B/public_places)
          example: 200601
        city_code:  
          type: string 
          description: |- 
            Код КЛАДР города терминала
          example: "7800000000000000000000000"
        express:   
          type: boolean 
          description: |- 
            Признак работы терминала в режиме экспресс-терминала
          example: true
        name:       
          type: string 
          description: |- 
            Наименование терминала
          example: "Санкт-Петербург Восток"
        address:    
          type: string 
          description: |- 
            Россия, г Санкт-Петербург, ул Латышских Стрелков, д 31
          example: "Россия, г Санкт-Петербург, ул Латышских Стрелков, д 31"
        default:    
          type: boolean
          description: |- 
            Признак терминала по умолчанию для города. Для каждого населенного пункта, по которому в ответе выводится информация, обязательно ровно один терминал является терминалом по умолчанию
          example: false

          
#Мультизаявка
    MultiRequest:
      type: object
      required:
        - appkey
        - sessionID
        - requestids
      properties:
        appkey:
          $ref: "#/components/schemas/AppKey"
        sessionID:
          $ref: "#/components/schemas/SessionID"
        requestids:
          type: array
          description: |-
            Перечень ID ранее созданных заказов, которые требуется объединить в мультизаявку. Для оформления заказа следует использовать метод "Перевозка сборных грузов", при этом параметр запроса "inOrder" должен иметь значение "false". Это указывает на то, что заказы не будут поставлены в очередь на обработку в момент создания. После объединения заказов при помощи метода v1/customers/multi_request они автоматически будут поставлены в очередь
          minItems: 2
          items:
            type: string
          example:
            - 1111
            - 2222
            - 3333
        comment:
          type: string
          description: Комментарий
          example: Текст комментария
      xml:
        name: request
          

    MultiRequestResponse:
      type: object
      xml:
        name: response
      required:
        - answer
      properties:
        answer:
          type: object
          required: [requestID, state]
          properties:
            requestID:
              type: integer
              description: ID созданной мультизаявки
              example: 112
            state:
              type: string
              description: Статус выполнения
              example: success

#Пакетный заказ (Пре алерт)
    BatchRequest:               
      type: object
      required: [appkey, sessionID, requestIDs]
      properties:
        appkey:    
          $ref: "#/components/schemas/AppKey" 
        sessionID: 
          $ref: "#/components/schemas/SessionID"
        requestIDs:
          type: array

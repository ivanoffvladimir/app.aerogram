openapi: 3.0.3
info:
  title: API Деловых Линий
  version: 3.0.0
  description: |-

    __API Деловых Линий__ – это набор сервисов, открытых для использования сторонними разработчиками. Наш API может быть использован как в самостоятельных проектах, так и в проектах по расширению функциональности, направленных на автоматизацию взаимодействия с Деловыми Линиями. 
    
    ---
          Swagger подключен к рабочему (prod) серверу. Любые операции, связанные с заказами, затрагивают реальные данные.      
    __Как начать работать с API__
    
    1. Зарегистрируйтесь на [сайте для разработчиков](https://dev.dellin.ru/registration/)
    2. Получите API-ключ на адрес электронной почты. Это идентификатор вашего приложения при выполнении всех запросов.
    3. Разработайте собственное решение на основе нашего API.
    

    
    __Важные особенности и рекомендации__
    
    - В Swagger UI приведены примеры запросов и ответов. Перед отправкой запросов значения из примеров (appkey, sessionID и т. д.) необходимо заменить на свои реальные данные.
    
    - Формат запроса: JSON или XML (указывается через {format} в URL).
    
    - Для автоматизации рекомендуем скачать YAML-файл и интегрировать его в свои процессы разработки.   
        Если вы измените example для appkey и sessionID в разделе components/schemas, новые значения автоматически появятся во всех методах, где используется эта схема. При этом если у метода заданы множественные примеры через examples, то значения из схемы использоваться не будут.
        
      

    ___
    
    __[Поддержка Public API](https://helpdesk.dellin.ru/)__
     
    __[Документация API Деловых Линии](https://dev.dellin.ru/api/)__ 
    
    __[Сценарии использования методов](https://dev.dellin.ru/api/scenarios/)__
  


    
    
servers:
  - url: 'https://api.dellin.ru'
tags:
  - name: Авторизация пользователя
    description: Группа методов авторизации
    externalDocs:
      url: 'https://dev.dellin.ru/api/auth/login/'
      description: Подробнее об авторизации
      
  - name: Выполнение расчета
    description: Группа методов выполнения расчета сроков и стоимости перевозки
    externalDocs:
      url: 'https://dev.dellin.ru/api/calculation/calculator/'
      description: Подробнее о калькуляторе перевозки
      
  - name: Оформление заказов
    description: Группа методов оформления заказов
    externalDocs:
      url: 'https://dev.dellin.ru/api/ordering/ltl-request/'
      description: Подробнее о перевозке сборных грузов
    

  - name: Информация по заказам
    description: Группа методов получения информации по заказам
    externalDocs:
      url: 'https://dev.dellin.ru/api/orders/search/'
      description: Подробнее о журнале заказов
      
  - name: Уведомления о событиях по заказам
    description: Группа методов управления подписками на получение уведомлений о событиях, происходящих с заказами 
    externalDocs:
      url: 'https://dev.dellin.ru/api/orders/webhook/'
      description: Подробнее о вебхуках

  - name: Печатные формы
    description: Группа методов получения печатных форм и скан-копии документов
    externalDocs:
      url: 'https://dev.dellin.ru/api/orders/print/'
      description: Подробнее о печатных формах


  - name: Управление заказом
    description: Группа методов внесения изменений в заказ
    externalDocs:
      url: 'https://dev.dellin.ru/api/order/check/'
      description: Подробнее о доступных изменениях
      
  - name: Терминалы
    description: Группа методов получения информации о терминалах Деловых Линий
    externalDocs:
      url: 'https://dev.dellin.ru/api/terminals/directory/'
      description: Подробнее о терминалах
      
  - name: Местоположения
    description: Группа методов для корректной работы с географическими данными
    externalDocs:
      url: 'https://dev.dellin.ru/api/places/search/'
      description: Подробнее о поиске географических объектов
      
  - name: Справочные методы
    description: Группа методов, обеспечивающая доступ к справочникам компании, необходимых для расчета и оформления заказов
    externalDocs:
      url: 'https://dev.dellin.ru/api/catalogs/directories/'
      description: Подробнее о справочниках
      
  - name: Самомаркировка
    description: Группа методов для самостоятельной маркировки
    externalDocs:
      url: 'https://dev.dellin.ru/api/marking/labels/'
      description: Подробнее о маркировке
      
      
      

            
paths:
# Авторизация
  /v3/auth/login.{format}:
    post:
      tags:
        - Авторизация пользователя
      summary: Авторизация пользователя
      description: |-
      
          [Авторизация пользователя](https://dev.dellin.ru/api/auth/login/) (получение идентификатора сессии – sessionID) предоставляет следующие возможности:
      
          - учитывать персональные скидки контрагента при [расчете стоимости перевозки](https://dev.dellin.ru/api/calculation/calculator/) (к контрагенту должен быть получен [полный доступ](https://www.dellin.ru/articles/192/#:~:text=%D0%9E%D0%B3%D1%80%D0%B0%D0%BD%D0%B8%D1%87%D0%B5%D0%BD%D0%BD%D1%8B%D0%B9%20%D0%B4%D0%BE%D1%81%D1%82%D1%83%D0%BF-,%D0%9F%D0%BE%D0%BB%D0%BD%D1%8B%D0%B9%20%D0%B4%D0%BE%D1%81%D1%82%D1%83%D0%BF,-%D0%A0%D0%B0%D1%81%D1%87%D1%91%D1%82%20%D1%81%D1%82%D0%BE%D0%B8%D0%BC%D0%BE%D1%81%D1%82%D0%B8) в Личном кабинете Деловых Линий);
          - просматривать созданные заказы с помощью API в Личном кабинете до приема груза к перевозке;
          - вносить [доступные изменения](https://dev.dellin.ru/api/order/check/) в заказ согласно этапу перевозки;
          - получать [печатные формы](https://dev.dellin.ru/api/orders/print/) документов;
          - оформлять заявки на перевозки [малотоннажным транспортом](https://dev.dellin.ru/api/ordering/mkt/);
          - оформлять заявки на [почасовую аренду транспорта](https://dev.dellin.ru/api/ordering/timerent/);
          - оформлять [мультизаявки](https://dev.dellin.ru/api/ordering/multi-request/);
          - оформлять [пакетный заказ](https://dev.dellin.ru/api/ordering/pre-alert/);
          - получать полную информации о заказах в [Журнале заказов](https://dev.dellin.ru/api/orders/search/);
          - искать заказы по артикулу грузового места в [Журнале заказов](https://dev.dellin.ru/api/orders/search/);
          - управлять подписками на [получение уведомлений о событиях](https://dev.dellin.ru/api/orders/webhook/), происходящих с заказами;
          - получать данные [адресной книги](https://dev.dellin.ru/api/book/counteragents/) Личного кабинета;
          - получать данные о [взаиморасчетах с контрагентами](https://dev.dellin.ru/api/payments/accounting/);
          - получать [этикетки для маркировки груза](https://dev.dellin.ru/api/marking/labels/);
          - получать [список доступных личных кабинетов операторов электронного документооборота (ЭДО)](https://dev.dellin.ru/api/catalogs/edms-accounts/);
          - [при оформлении заказа](https://dev.dellin.ru/api/ordering/ltl-request/) запрашивать отправку черновика электронного поручения экспедитору в личный кабинет системы ЭДО (дополнительное требование – [полный доступ](https://www.dellin.ru/articles/192/#full) к заказчику перевозки);
          - использовать "[Суперсервис](https://www.dellin.ru/client/epd-script/#superservice)" для работы с электронными экспедиторскими документами [при оформлении заказа](https://dev.dellin.ru/api/ordering/ltl-request/) (дополнительное требование – [полный доступ](https://www.dellin.ru/articles/192/#full) к заказчику перевозки).

          
          __Примечания:__

          Чтобы получить логин и пароль, пользователю следует зарегистрироваться на сайте компании [Деловые Линии](https://www.dellin.ru/#registration)
      parameters:
        - $ref: '#/components/parameters/format'
      operationId: v3_auth_login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          text/xml:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
        - {}
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                'Структура ответа':              
                  $ref: '#/components/examples/V3AuthLoginResponseError'              
  
            text/xml:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                'Структура ответа':              
                  $ref: '#/components/examples/V3AuthLoginResponseError'      
        '401':
          description: Unauthorized 
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                'Структура ответа':               
                  $ref: '#/components/examples/V3AuthLoginResponseUnauthorized'              

            text/xml:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                'Структура ответа':               
                  $ref: '#/components/examples/V3AuthLoginResponseUnauthorized'   
        '500':
          description: Internal Server Error(Внутренняя ошибка сервера)
          
  /v4/auth/login.{format}:
    post:
      tags:
        - Авторизация пользователя
      summary: Авторизация с использованием токена
      description: |-
        [Метод](https://dev.dellin.ru/api/auth/login/#_header12) позволяет авторизовать пользователя.
      security:
        - {}
      parameters:
        - $ref: '#/components/parameters/format'
      operationId: v4_auth_login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/V4LoginRequest'
          text/xml:
            schema:
              $ref: '#/components/schemas/V4LoginRequest'
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                'Структура ответа':              
                  $ref: '#/components/examples/V3AuthLoginResponseError'              
  
            text/xml:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                'Структура ответа':              
                  $ref: '#/components/examples/V3AuthLoginResponseError'                      
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
            text/xml:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '500':
          description: Internal Server Error(Внутренняя ошибка сервера)
                    
  /v3/auth/logout.{format}:
    post:
      tags:
        - Авторизация пользователя
      summary: Удаление сессии авторизации
      description: |-
        [Метод](https://dev.dellin.ru/api/auth/login/#_header19) позволяет закрыть текущую сессию авторизации.
      security:
        - {}
      parameters:
        - $ref: '#/components/parameters/format'
      operationId: v3_auth_logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutSessionInfoRequest'
          text/xml:
            schema:
              $ref: '#/components/schemas/LogoutSessionInfoRequest'
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
            text/xml:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '500':
          description: Internal Server Error(Внутренняя ошибка сервера)
          
  /v3/auth/session_info.{format}:
    post:
      tags:
        - Авторизация пользователя
      summary: Данные сессии
      description: |
          [Отслеживание состояния текущей сессии](https://dev.dellin.ru/api/auth/login/#_header30) можно использовать для предварительного возобновления сессии перед отправкой запроса к API Личного кабинета.
      parameters:
        - $ref: '#/components/parameters/format'
      operationId: v3_auth_session_info
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutSessionInfoRequest'
          text/xml:
            schema:
              $ref: '#/components/schemas/LogoutSessionInfoRequest'
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionInfoResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/SessionInfoResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                'Структура ответа':   
                  $ref: '#/components/examples/V3AuthSessionInfoResponseUnauthorized' 
            text/xml:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                'Структура ответа':   
                  $ref: '#/components/examples/V3AuthSessionInfoResponseUnauthorized' 
        '500':
          description: Internal Server Error(Внутренняя ошибка сервера)
          
          
  /v2/counteragents.{format}:
    post:
      tags:
        - Авторизация пользователя
      summary: Cписок контрагентов
      description: |-
          [Сервис](https://dev.dellin.ru/api/auth/counteragents/) позволяет:
          - получить основную информацию о контрагентах, связанных с одной учетной записью в ЛК;
          - получить полную информацию о контрагентах, связанных с одной учетной записью в ЛК;
          - получить информацию о взаиморасчётах по каждому контрагенту;
          - сменить текущего контрагента для осуществления разных операций в ЛК. 
      parameters:
        - $ref: '#/components/parameters/format'
      operationId: v2_counteragents
      requestBody:
        description: |-
          Для выполнения тестового примера запроса на получения полного списка контрагентов уберите из тела запроса параметр __cauid__. 
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CounteragentsRequest'
          text/xml:
            schema:
              $ref: '#/components/schemas/CounteragentsRequest'
        required: true
      security:
        - {}
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CounteragentsResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/CounteragentsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
            text/xml:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '500':
          description: Internal Server Error(Внутренняя ошибка сервера)
          
#Выполнение расчета   
  /v2/calculator.{format}:
    post:
      tags:
        - Выполнение расчета
      summary: Калькулятор стоимости и сроков перевозки
      description: |-
        [Сервис](https://dev.dellin.ru/api/calculation/calculator/) позволяет получить подробную информацию о стоимости и сроках интересующего способа перевозки. 
        
      parameters:
        - $ref: '#/components/parameters/format'
      operationId: v2_calculator
      security:
        - {}
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/V2CalculatorRequest'
              
            examples:
              'Общая структура запроса':
                $ref: '#/components/examples/V2CalculatorExample01'

              'Пример 1 (Адрес - Адрес)':
                $ref: '#/components/examples/V2CalculatorExample02'
                
              'Пример 2 (Терминал - Терминал)':
                $ref: '#/components/examples/V2CalculatorExample03'
                
              'Пример 3 (Доставка малогабаритного груза)':
                $ref: '#/components/examples/V2CalculatorExample04'
                
              'Пример 4  (Экспресс-перевозка: Терминал - Адрес)':
                $ref: '#/components/examples/V2CalculatorExample05'

          text/xml:
            schema:
              $ref: '#/components/schemas/V2CalculatorRequest'
            examples:
              'Общая cтруктура запроса':
                $ref: '#/components/examples/V2CalculatorExample01'

              'Пример 1 (Адрес - Адрес)':
                $ref: '#/components/examples/V2CalculatorExample02'
                
              'Пример 2 (Терминал - Терминал)':
                $ref: '#/components/examples/V2CalculatorExample03'
                
              'Пример 3 (Доставка малогабаритного груза)':
                $ref: '#/components/examples/V2CalculatorExample04'
                
              'Пример 4  (Экспресс-перевозка: Терминал - Адрес)':
                $ref: '#/components/examples/V2CalculatorExample05'


        required: true
        description: |-
          Структура запроса описывает все возможные параметры, включая взаимоисключающие.
          
          Описание примеров на сайте: [ссылка](https://dev.dellin.ru/api/examples/calculation/)
 
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2CalculatorResponse'
              examples: 
                'Структура ответа':
                  $ref: '#/components/examples/V2CalculatorResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/V2CalculatorResponse'
              examples: 
                'Структура ответа':
                  $ref: '#/components/examples/V2CalculatorResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                'Структура ответа':              
                  $ref: '#/components/examples/V2CalculatorError'              

            text/xml:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                'Структура ответа':              
                  $ref: '#/components/examples/V2CalculatorError'   
                  
        '401':
          description: Unauthorized 
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
            text/xml:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '500':
          description: Internal Server Error(Внутренняя ошибка сервера)
          
          

  /v1/public/calculator_sf.{format}:
    post:
      summary: Калькулятор услуги Доставка до адреса
      tags: 
        - Выполнение расчета
      description: |
        [Сервис](https://dev.dellin.ru/api/calculation/delivery/) позволяет рассчитать стоимость услуги "Доставка до адреса" для активной перевозки.
      parameters:
        - $ref: '#/components/parameters/format'
      operationId: v1_calculator_sf
      requestBody:
        required: true
        content:
          application/json:
            schema: 
              $ref: '#/components/schemas/CalculatorSfRequest' 
            examples:
              'Общая структура запроса':
                $ref: '#/components/examples/V1CalculatorSfExample01'

              'Пример 1':
                $ref: '#/components/examples/V1CalculatorSfExample02'
          text/xml:
            schema: 
              $ref: '#/components/schemas/CalculatorSfRequest'
            examples:
              'Общая структура запроса':
                $ref: '#/components/examples/V1CalculatorSfExample01'

              'Пример 1':
                $ref: '#/components/examples/V1CalculatorSfExample02'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/CalculatorSfResponse'
              examples:
                'Cтруктура ответа':
                    $ref: '#/components/examples/CalculatorSfResponse'

            text/xml:
              schema:  
                $ref: '#/components/schemas/CalculatorSfResponse'
              examples:
                'Cтруктура ответа':
                    $ref: '#/components/examples/CalculatorSfResponse'

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
            text/xml:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '500':
          description: Internal Server Error(Внутренняя ошибка сервера)

#Справочные методы
  /v1/public/request_services.{format}:
    post:
      tags:

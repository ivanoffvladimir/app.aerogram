    DeliveryDatesRequest:
      type: object
      xml:
        name: request
      required: [appkey, sessionID, docID, delivery]
      properties:
        appkey:
          $ref: '#/components/schemas/AppKey'
        sessionID:
          $ref: '#/components/schemas/SessionID'
        docID:
          type: string
          description: |-
              Номер заказа, накладной или заявки на доставку до терминала, оформленной при помощи метода [Перевозка сборных грузов](https://dev.dellin.ru/api/ordering/ltl-request/), на основании которой планируется дозаказать доставку до адреса (см. метод [Дополнение заказа доставкой до адреса получателя](https://dev.dellin.ru/api/ordering/sfrequest/))
          example: '401111837'
        delivery:
          type: object
          description: Информация о доставке
          properties:
            arrival:
              $ref: '#/components/schemas/ArrivalSfRequest'
              
              
    DeliveryDatesResponse:
      type: object
      xml:
        name: response
      properties:
        MetaData:
          $ref: '#/components/schemas/MetaData'
        data:
          type: object
          properties:
            dates:
              type: array
              items:
                type: string
                format: date
            priorityDirectionForDelivery:
              type: boolean
              description: Признак приоритетного направления доставки
            foundAddresses:
              type: array
              items:
                $ref: '#/components/schemas/FoundAddress'
      example:
        metadata:
          status: 200
          generated_at: '2020-06-03 09:06:54'
        data:
          dates:
            - '2020-06-04'
            - '2020-06-05'
            - '2020-06-06'
          priorityDirectionForDelivery: true
          foundAddresses:
            - field: delivery.derival.address
              source: 'Омская обл., Омск, Ленина, 5'
              result: 'Россия, Омская обл, г Омск, ул Ленина, д 5'                
                
    RequestTimeIntervalRequest:
      type: object
      description: Запрос на получение доступных временных интервалов передачи груза на адресе отправителя
      properties:
        appkey:
          $ref: '#/components/schemas/AppKey'
        sessionID:
          $ref: '#/components/schemas/SessionID'
        delivery:
          type: object
          properties:
            deliveryType:
              $ref: '#/components/schemas/DeliveryType'
            derival:
              type: object
              properties:
                produceDate:
                  type: string
                  format: date
                  description: 'Дата передачи груза водителю-экспедитору на адресе отправителя Формат: ГГГГ-ММ-ДД'
                  example: '2020-06-03'
                addressID:
                  $ref: '#/components/schemas/AddressID'
                address:
                  $ref: '#/components/schemas/Address'
                city:
                  type: string
                  description: Код КЛАДР города
                  example: '5500000100000000000000000'
      xml:
        name: request
        
    RequestTimeIntervalResponse:
      type: object
      description: Ответ с допустимыми интервалами передачи груза
      properties:
        MetaData:
          $ref: '#/components/schemas/MetaData'
        data:
          type: object
          properties:
            interval_from:
              type: string
              format: time
              example: '00:00:00'
              description: Время начала допустимого интервала
            interval_to:
              type: string
              format: time
              example: '23:59:00'
              description: Время окончания допустимого интервала
            default_min_same_day_period:
              type: integer
              example: 6
              description: Минимальный интервал для оформления доставки в день создания заявки по умолчанию
            min_same_day_period:
              type: integer
              example: 2
              description: 'Минимальный интервал для доставки в день создания заявки, актуальный на текущий момент'
            min_period:
              type: integer
              example: 0
              description: Минимальный интервал между оформлением и передачей груза
            same_day:
              type: boolean
              example: false
              description: Признак доступности передачи груза в день создания заявки
            foundAddresses:
              type: array
              items:
                $ref: '#/components/schemas/FoundAddress'
      xml:
        name: response
        
    RequestDeliveryTimeIntervalRequest:
      type: object
      description: Запрос на получение допустимых временных интервалов передачи груза на адресе получателя
      properties:
        appkey:
          $ref: '#/components/schemas/AppKey'
        sessionID:
          $ref: '#/components/schemas/SessionID'
        docID:
          type: string
          description: 'Номер заказа, накладной или заявки, по которой необходимо получить информацию о возможных интервалах доставки до адреса получателя'
          example: '2000085063763'
        delivery:
          type: object
          properties:
            arrival:
              type: object
              properties:
                produceDate:
                  type: string
                  format: date
                  description: Дата доставки груза до адреса получателя
                  example: '2020-06-03'
                addressID:
                  $ref: '#/components/schemas/AddressID'
                address:
                  $ref: '#/components/schemas/Address'
                city:
                  type: string
                  description: Код КЛАДР города
                  example: '5500000100000000000000000'
      xml:
        name: request
        
        
    TerminalDispatchDatesRequest:
      type: object
      description: Запрос на подбор даты передачи груза на терминал отправления.
      properties:
        appkey:
          $ref: '#/components/schemas/AppKey'
        sessionID:
          $ref: '#/components/schemas/SessionID'
        delivery:
          type: object

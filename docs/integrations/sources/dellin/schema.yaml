          example: "Заказ не найден"   

#История статусов заказа

    StatusesHistoryRequest:
      type: object
      description: Параметры запроса истории статусов заказа
      required: [appkey]
      properties:
        appkey:
          $ref: "#/components/schemas/AppKey"
        docIds:
          type: array
          description: |-
            Номер заказа, накладной или заявки. Возможна передача нескольких параметров. Максимум может быть передано 5 значений

            *В запросе обязательно должен быть передан один из взаимоисключающих параметров: "docIds" или "webOrderNumber"
          maxItems: 5
          items:
            type: string
          example: 
              - "400267443"
              - "400267444"
            
        webOrderNumber:
          type: string
          description: |-
            Внутренний номер заказа клиента (например, номер заказа интернет-магазина)
            
            *В запросе обязательно должен быть передан один из взаимоисключающих параметров: "docIds" или "webOrderNumber"
          example: "935743976"
      oneOf:                
        - required: [docIds]
        - required: [webOrderNumber]
      xml: 
        name: request
        
    StatusesHistoryResponse:
      type: object
      required: [metadata, data]
      properties:
        metadata:
          $ref: '#/components/schemas/MetaData'
        data:
          type: object
          required: [statusHistory]
          properties:
            statusHistory:
              type: object
              description: |- 
                  Перечень найденных заказов и история изменения их статусов
              additionalProperties:
                type: array
                items:
                  $ref: '#/components/schemas/StatusHistory'
              example:
                "400267443":
                  - number: "400267443"
                    state: "waiting"
                    stateName: "Ожидает сдачи на терминал"
                    stateDate: "2023-01-12T15:52:40+03:00"
                    detailedStatus: "waiting"
                    detailedStatusRus: null
                    detailedStatusDate: "2023-01-12T15:52:40+03:00"
                  - number: "400267443"
                    state: "inway"
                    stateName: "Груз в пути"
                    stateDate: "2023-01-25T11:10:44+03:00"
                    detailedStatus: "inway"
                    detailedStatusRus: null
                    detailedStatusDate: "2023-01-25T11:10:44+03:00"
            info:
              type: array
              items:
                $ref: '#/components/schemas/InfoMessage'
      xml: 
        name: response
        
        
    StatusHistory:
      type: object
      required: [number, state, stateName, stateDate]
      properties:
        number:
          type: integer
          description: Переданный номер документа, по которому была найдена история изменения статусов
        state:
          type: string
          description: Статус заказа на английском языке (см. справочник [Статусы заказа груза](https://dev.dellin.ru/api/catalogs/directories/#_header32)) 
        stateName:
          type: string
          description: Статус заказа на русском языке (см. справочник [Статусы заказа груза](https://dev.dellin.ru/api/catalogs/directories/#_header32)) 
        stateDate:
          type: string
          format: date-time
          description: "Дата установки статуса. Формат: ГГГГ-ММ-ДД ЧЧ:ММ:СС+ЧЧ:ММ"
        detailedStatus:
          type: string
          description: |-
            Дополнительный статус заказа на английском языке.
  
            Возможные значения:
            
            - "pickup_waiting_pickup";
            - "pickup_departed";
            - "pickup_arrived";
            - "pickup_finished";
            - "delivery_waiting_delivery";
            - "delivery_departed";
            - "delivery_arrived";
            - "delivery_finished"
        detailedStatusRus:
          type: string
          description: |-
            Дополнительный статус заказа на русском языке.

            Возможные значения (порядок соответствует порядку возможных значений параметра "docId.detailedStatus"):
            
            - "Ожидается забор" – водитель ещё не выехал на адрес отправителя;
            - "Машина едет на адрес";
            - "Машина на адресе";
            - "Груз забран. Едет на терминал";
            - "Ожидается доставка" – водитель ещё не выехал на адрес получателя;
            - "Машина едет на адрес";
            - "Машина на адресе";
            - "Груз доставлен"
        detailedStatusDate:
          type: string
          format: date-time
          description: "Дата установки дополнительного статуса.Формат: ГГГГ-ММ-ДД ЧЧ:ММ:СС+ЧЧ:ММ"

    InfoMessage:
      type: object
      required: [number, message]
      properties:
        number:
          type: string
          description: Переданный номер документа
          example: "400267444"
        message:
          type: string
          description: Информационное сообщение
          example: "Найдено более одного заказа"

#Подробные статусов заказа

    DetailedStatusesRequest:
      type: object
      description: Параметры запроса подробных статусов заказа
      required: [appkey, orderID]
      properties:
        appkey:
          $ref: "#/components/schemas/AppKey"
        orderID:
          type: string
          description: |-
             Номер заказа
          example: 
              - "400267443"    
        category:
          type: array
          description: |-
            Категория статуса
            Возможные значения:
            
            - EXECUTIONS – статус исполнения заказа (груз в пути, заказ отменен и т. д.);
            - PROBLEMS –  сложности с заказом (начало платного хранения, получатель отказался от груза и т. д.).
            Примечание. Статус, связанный с необходимостью подписать электронное поручение экспедитору, относится к данной категории;
            - WARNINGS – предупреждения (для получения груза требуется внести оплату, часть груза выдана и т. д.).
            Примечание. Статус, связанный с проверкой необходимости подписать электронное поручение экспедитору, относится к данной категории;
            - PAYMENTS – информация по оплате (заказ оплачен, заказ оплачен частично и т. д.);
            - INFO – дополнительная информация (для получения оплата не требуется);
            - OTHER – прочие статусы (данные для оформления пропуска для водителя скоро будут доступны и т. д.).
            
            Если параметр не передан, в ответе будут присутствовать все актуальные статусы
          items:
            type: string
          example: 
              - "EXECUTIONS"
              - "PROBLEM"

    DetailedStatusesResponse:
      type: object
      required: [metadata, data]
      properties:
        metadata:
          $ref: '#/components/schemas/MetaData'
        statuses:
          type: array
          items:
           $ref: '#/components/schemas/Statuses'

    Statuses:
      type: object
      required: [code, name, category, setTime]
      properties:
        code:
          type: string
          description: Кодовое наименование статуса
          example: "PICKUP_SCHEDULED"
        name:
          type: string
          description: Подробный статус
          example: "Запланирован забор груза"
        category:
          type: string
          description: Категория статуса
          example: "EXECUTIONS"
        setTime:
          type: string
          description: |-
           Дата и время установки статуса. Формат: "ГГГГ-ММ-ДДTЧЧ:ММ:СС"
          example: "2026-06-12T23:25:06"
        attributes:
          $ref: '#/components/schemas/Attributes'         
        parent:
          $ref: '#/components/schemas/Parent'

    Attributes:
      type: object
      description: |-
       Дополнительная информация. Варианты вложенных параметров зависят от статуса. Может быть несколько объектов или не быть ни одного.
      properties:
        debt:
          type: integer
          description: Сумма задолженности
          example: 255
        date:
          type: string
          description: |-
           Дата, актуальная для статуса. Например, дата, на которую запланирована доставка, или дата, с которой начинается срок платного хранения. Формат: "ГГГГ-ММ-ДД ЧЧ:ММ:СС"
          example: "2026-06-18T14:25:06"

    Parent:
      type: object
      description: Данные родительского статуса
      properties:
        code:
          type: string
          description: Кодовое наименование родительского статуса
          example: "PICKUP"
        name:
          type: string
          description: Подробный родительский статус
          example: "PICKUP"

#История изменений заказа

    OrderHistoryRequest:
      type: object
      required: [appkey, sessionID, orderID]
      properties:
        appkey:
          $ref: "#/components/schemas/AppKey"
        sessionID:
          $ref: "#/components/schemas/SessionID"
        orderID:
          type: string
          description: Номер заказа, по которому необходимо получить данные
          example: "2000395000025"
      xml: 
        name: request

    OrderHistoryResponse:
      type: object
      required: [metadata, data]
      properties:
        metadata:
          $ref: '#/components/schemas/MetaData'
        data:
          type: array
          description: Массив с информацией по каждому изменению
          items:
            $ref: '#/components/schemas/OrderChangeRecord'
      xml: 
        name: response
        
    OrderChangeRecord:
      type: object
      required: [typeCode, typeName, createdAt, status, detailedInfo]
      properties:
        typeCode:
          type: string
          description: Тип изменённой информации.
          enum:
            - receiver_change
            - payer_change
            - payment_order_change
            - contact_info_change
            - giveout_suspension_change
            - giveout_resumption_change
            - delivery_cancel_change
            - pickup_cancel_change
            - delivery_info_change
            - pickup_info_change
        typeName:
          type: string
          description: Наименование типа изменённой информации на русском языке.
          enum:
            - Изменение получателя
            - Изменение плательщика
            - Разрешить выдачу груза по платежному поручению
            - Изменение контактной информации
            - Приостановка выдачи груза
            - Возобновление выдачи груза
            - Отмена доставки до адреса
            - Отмена доставки от адреса
            - Смена адреса и времени доставки до адреса
            - Смена адреса и времени доставки от адреса

        createdAt:
          type: string
          format: date-time
          description:   Дата изменения
        status:
          type: string
          description: Статус изменения.
          enum: [success, in_progress, failed]
        detailedInfo:
          type: string
          description: Свёрстанная html-страница с подробной информацией о запросе на изменение заказа
        document:
          type: string
          description: |- 
              Ссылка на печатную форму с данными заказа. Если была изменена контактная информация (значение параметра "typeCode" - "contact_info_changes"), то параметр отсутствует в ответе

#Самомаркировка
    
    CargoPlaces:
      type: object
      required: 
        - cargoPlace
      properties:
        cargoPlace:
          type: string
          description: |-
            Артикул грузового места (грузовые места маркируются заказчиком), значение может быть неуникальным.

            Если нет информации / возможности передать информацию по грузовому месту, но необходимо сгенерировать этикетки, можно передать null в качестве значения параметра
          example: 123123

        amount:
          type: integer
          default: 1
          description: |-
            Количество грузовых мест с одинаковым артикулом. Если значение не передано, то параметр принимает значение 1
          example: 1



    ShipmentLabelsRequest:

          $ref: '#/components/schemas/TerminalID'
        addressID:
          $ref: '#/components/schemas/AddressID'
        address:
          $ref: '#/components/schemas/Address'
        additionalAddress:
          $ref: '#/components/schemas/AdditionalAddress'        
        time:
          $ref: '#/components/schemas/DeliveryWorkTime'

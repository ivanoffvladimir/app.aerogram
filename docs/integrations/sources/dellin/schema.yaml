        arrivalSearch:
          type: string
          maxLength: 1024
          minLength: 2 
          description: "Адрес доставки в виде текста или координат. Передача одного из взаимоисключающих параметров arrivalPoint или arrivalSearch является обязательной."
        docSQLUid:      
          type: string
          description: "UID накладной. Для получения идентификатора накладной необходимо воспользоваться методом [Журнал заказов](https://dev.dellin.ru/api/orders/search/)"  
        calculateDate:  
          type: string 
          format: date
          description: "Дата прибытия груза. Если параметр не передан, то используется текущая дата" 
        arrivalPeriodVisit:
          $ref: '#/components/schemas/PeriodVisit'
        arrivalServices:
          type: array
          items: 

              type: number
              format: float
            type:
              type: integer
        shipmentDerival: 
          type: string
        priorCall: 
          type: boolean
        noNeedAgreement: 
          type: boolean              
        documentsForReceive: 
          type: array            
          items:
            $ref: '#/components/schemas/AcDoc'
      required:
        - arrival
        - deliveryType
        - derival
              
              
    Insurance:
      required: [statedValue, term]

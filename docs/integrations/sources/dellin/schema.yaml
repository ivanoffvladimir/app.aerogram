        width:
          type: number
          format: float
          minimum: 0
          description: 'Ширина самого широкого грузового места, м.'
          example: 1
        height:
          type: number
          format: float
          minimum: 0
          description: 'Высота самого высокого грузового места, м.'
          example: 1
        weight:
          type: number
          format: float
          minimum: 0
          description: 'Вес самого тяжелого грузового места, кг.'
          example: 100
        totalVolume:
          type: number
          format: float
          minimum: 0
          description: 'Общий объём груза, куб. м.'
          example: 1
        totalWeight:
          type: number
          format: float
          minimum: 0
          description: 'Общий вес груза, кг.'
          example: 100
        oversizedVolume:
          type: number
          format: float
          minimum: 0
          description: 'Вес негабаритных грузовых мест, кг'
          example: 1
        oversizedWeight:
          type: number
          format: float
          minimum: 0
          description: 'Объём негабаритных грузовых мест, куб. м'
          example: 1
        hazardClass:
          type: number
          format: float
          default: 0
          description: Класс опасности груза.
          example: 0
        insurance:
          $ref: '#/components/schemas/InsuranceV2Request'
        freightUID:
          type: string
          maxLength: 34
          description: 'UID характера груза из справочника [Характер груза](https://dev.dellin.ru/api/catalogs/directories/#_header10). Для поиска UID по наименованию груза следует использовать сервис [Характер груза: поиск по строке (перевозка сборных грузов)](https://dev.dellin.ru/api/catalogs/freight-types/#_header2). '
          example: '0x82e6000423b423b711da7d15445d42cb'
        originCountry:
          type: object
          description: 'Информация о стране происхождения груза. '
          properties:
            codeOksmNumeric:
              type: string
              description: 'Код страны согласно общероссийскому классификатору стран мира (см. метод "[Поиск стран происхождения грузов](https://dev.dellin.ru/api/places/search/)")'

    V2RequestPayment:
      type: object
      description: Оплата перевозки
      properties:
        type:
          $ref: '#/components/schemas/PaymentTypeEnum'
        primaryPayer:
          $ref: '#/components/schemas/Payer'
        paymentCity:
          type: string
          description: Код КЛАДР населённого пункта оплаты
          example: '7700000000000000000000000'
          externalDocs:
            url: 'https://dev.dellin.ru/api/places/kladr/'
            description: Поиск КЛАДР
        paymentCitySearch:
          required:
            - search
          type: object
          description: Данные по населённому пункту оплаты в виде произвольной строки
          properties:
            search:
              type: string
              maxLength: 1024
              minLength: 2
              example: Москва
              description: 'Населённый пункт в виде произвольной строки. Максимум – 1024 символа. Помимо наименования населённого пункта, в строке может быть передано наименование страны, региона, района – это позволит уточнить поиск и исключить ошибки, которые могут возникнуть из-за одинаковых названий населённых пунктов'
        cashOnDelivery:
          type: array
          items:
            $ref: '#/components/schemas/CashOnDelivery'
        promocode:
          type: string
          description: Промокод
          example: promo123
          
      required:
        - type
        - primaryPayer
        
    DeliveryType:
      type: object
      description: Вид доставки для межтерминальной перевозки
      properties:
        type: 
          enum:
            - auto
            - express
            - small
            - letter
            - avia
          type: string
          description: |-
            - auto - автодоставка
            - express - экспресс-перевозка
            - small - доставка малогабаритного груза
            - letter - доставка документов
            - avia - авиаперевозка
      required:
        - type

    V2RequestPackages:
      type: object
      description: Данные по упаковке.
      properties:

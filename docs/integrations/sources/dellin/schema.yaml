        Проверить статус заявки можно при помощи метода [История изменений заказа](https://dev.dellin.ru/api/swagger/#/%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D1%8F%20%D0%BF%D0%BE%20%D0%B7%D0%B0%D0%BA%D0%B0%D0%B7%D0%B0%D0%BC/v3_orders_history).

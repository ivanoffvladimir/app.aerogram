          example: "г Березовский"
        flat:                
          type: string
          description: Квартира
          example: ""
        house:               
          type: string
          description: Дом
          example: "Московский"

        normalized_source:   
          type: string 
          description: Стандартизированный адрес одной строкой без замены корпуса/строения на «д.»
          example: "623704, Россия, обл Свердловская, г Березовский, тер п.Первомайский, корп. 5, стр. 24"

        region_kladr_id:     
          type: string
          description: Код КЛАДР региона
          example: "6600000000000000000000000"
        region_with_type:    

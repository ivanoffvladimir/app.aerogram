  /v2/request/cargo/shipment_labels/batch.{format}: 
    post:
      tags: 
        - Самомаркировка
      summary: Передача артикулов грузовых мест по массиву заказов
      description: |-
        [Метод](https://dev.dellin.ru/api/marking/labels/#_header2) используется для передачи артикулов грузовых мест, если требуется получить этикетки только на груз (не на сопроводительные документы). Метод позволяет передать артикулы сразу по нескольким заказам, при этом этикетки будут содержать внутренний номер заказа. Исключение: при передаче артикула грузового места этикетка размером 80х50 мм вместо внутреннего номера заказа будет содержать этот артикул.
        Если требуется получить этикетки на сопроводительные документы, то для передачи артикулов грузовых мест следует использовать метод [Передача артикулов грузовых мест](https://dev.dellin.ru/api/swagger/#/%D0%A1%D0%B0%D0%BC%D0%BE%D0%BC%D0%B0%D1%80%D0%BA%D0%B8%D1%80%D0%BE%D0%B2%D0%BA%D0%B0/v2_cargo_shipment_labels)

  /v3/orders/suspend.{format}:
    post:
      tags:
        - Управление заказом
      summary: Запрос на приостановку выдачи груза
      description: |-
        [Сервис](https://dev.dellin.ru/api/order/suspend/#_header2) позволяет приостановить выдачу груза по заказу на срок до 30 календарных дней.
        
        Необходим полный доступ к отправителю. Запрос может быть отклонён при:
        - наличии активной заявки на приостановку;
        - наличии активной отмены доставки;
        - подаче после 17:00 последнего рабочего дня перед доставкой (для доставки до адреса).


        [Доступные изменения заказа](https://dev.dellin.ru/api/swagger/#/%D0%A3%D0%BF%D1%80%D0%B0%D0%B2%D0%BB%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%B7%D0%B0%D0%BA%D0%B0%D0%B7%D0%BE%D0%BC/change_available). Изменения вступают в силу не сразу. После дополнительной проверки заявка на внесение изменений может быть одобрена или отклонена. 
        
        Проверить статус заявки можно при помощи метода [История изменений заказа](https://dev.dellin.ru/api/swagger/#/%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D1%8F%20%D0%BF%D0%BE%20%D0%B7%D0%B0%D0%BA%D0%B0%D0%B7%D0%B0%D0%BC/v3_orders_history).
      operationId: suspendDelivery
      parameters:
        - $ref: '#/components/parameters/format'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuspendRequest'
          text/xml:
            schema:
              $ref: '#/components/schemas/SuspendRequest'
      responses:
        '200':
          description: Successful response 
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuspendResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/SuspendResponse'
        '400': 
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples: 
                'Структура ответа':
                  $ref: '#/components/examples/SuspendError'              
            text/xml:
              schema:
                $ref: '#/components/schemas/Error'
              examples: 
                'Структура ответа':
                  $ref: '#/components/examples/SuspendError' 
 

        "401":
          description: Unauthorized
          content:
            application/json:
              schema: 
                $ref: "#/components/schemas/Unauthorized"
            text/xml:
              schema: 
                $ref: "#/components/schemas/Unauthorized"
        "500": 
          description: Internal Server Error(Внутренняя ошибка сервера)

  /v3/orders/resume.{format}:
    post:
      tags:
        - Управление заказом
      summary: Запрос на возобновление выдачи груза
      description: |-
        [Сервис](https://dev.dellin.ru/api/order/suspend/#_header12) позволяет возобновить выдачу груза, ранее приостановленную. Необходим полный доступ к отправителю. 
        
        [Доступные изменения заказа](https://dev.dellin.ru/api/swagger/#/%D0%A3%D0%BF%D1%80%D0%B0%D0%B2%D0%BB%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%B7%D0%B0%D0%BA%D0%B0%D0%B7%D0%BE%D0%BC/change_available). Изменения вступают в силу не сразу. После дополнительной проверки заявка на внесение изменений может быть одобрена или отклонена. 
        
        Проверить статус заявки можно при помощи метода [История изменений заказа](https://dev.dellin.ru/api/swagger/#/%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D1%8F%20%D0%BF%D0%BE%20%D0%B7%D0%B0%D0%BA%D0%B0%D0%B7%D0%B0%D0%BC/v3_orders_history).
      operationId: resumeDelivery
      parameters:
        - $ref: '#/components/parameters/format'
      requestBody:
        description: "Для выполнения запроса укажите необходимый номер заказа (__orderID__) и дату, с которой должна стать доступной выдача груза (__resumeDate__)"
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResumeRequest'
          text/xml:
            schema:
              $ref: '#/components/schemas/ResumeRequest'
      responses:
        '200':
          description: Successful response 
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuspendResponse'
            text/xml:
              schema:
                $ref: '#/components/schemas/SuspendResponse'
        '400': 
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples: 
                'Структура ответа':
                  $ref: '#/components/examples/SuspendError'              
            text/xml:
              schema:
                $ref: '#/components/schemas/Error'
              examples: 
                'Структура ответа':
                  $ref: '#/components/examples/SuspendError' 

        "401":
          description: Unauthorized
          content:
            application/json:
              schema: 
                $ref: "#/components/schemas/Unauthorized"
            text/xml:
              schema: 
                $ref: "#/components/schemas/Unauthorized"
        "500": 
          description: Internal Server Error(Внутренняя ошибка сервера)



components:

  parameters:
    format:
      name: format
      in: path
      required: true
      description: |-
        Формат, в котором будет передано тело запроса. По умолчанию – json
        
        
        Для корректного получения ответа в XML необходимо также указать заголовок Accept: text/xml.
      schema:
        type: string
        enum:
          - json
          - xml
          
          
  schemas:

#Общие параметры
    AppKey:
      type: string
      description: Ключ приложения.
      example: 00000000-0000-0000-0000-000000000000
      
    SessionID:
      type: string
      description: ID сессии для запросов к данным Личного кабинета.
      example: 00000000-0000-0000-0000-000000000000
      
    MetaData:
      type: object
      description: Системная информация.
      properties:
        status:
          type: integer
          description: Эмуляция http-кода состояния.
          example: 200
        generated_at:
          type: string
          description: Дата и время генерации ответа сервера.
          format: date-time
          example: '2025-06-18 12:37:28'
          
    MetaDataError:
      type: object
      description: Системная информация.
      properties:
        status:
          type: integer
          example: 400
          description: Эмуляция http-кода состояния. 
        detail:
          type: string
          description: Текстовое описание ответа сервера
        generated_at:
          type: string
          format: date-time
          description: Дата и время генерации ответа сервера
          
    Error:
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/MetaDataError'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorContent'
          minItems: 1
      xml:
        name: response        
        
        
    Unauthorized:
      type: object
      xml:
        name: response
      properties:
        errors:
          type: string
          example: Unauthorized
          

          
    ErrorContent:
      type: object
      properties:
        code:
          type: integer
        title:
          type: string
        detail:
          type: string
        fields:
          type: array
          items:
            type: string
          minItems: 0
        link:
          type: string
          format: uri
          
    Requester:
      type: object
      description: Заказчик перевозки
      properties:
        role:
          $ref: '#/components/schemas/RequesterRole'
        uid:
          type: string
          maxLength: 36
          description: |-
            UID контрагента.
            Параметр игнорируется при отсутствии полного доступа к контрагентам.
          example: ae62f076-d602-4341-b691-45bf8dfe4a10
          externalDocs:
            url: 'https://dev.dellin.ru/api/auth/counteragents/'
            description: Список контрагентов
    
    RequesterRole:
      type: string
      description: |-
        Роль в перевозке.
        Возможные значения:
        - "sender" – отправитель;
        - "receiver" – получатель;
        - "payer" – плательщик;
        - "third" – третье лицо
      example: sender
      enum:
        - payer
        - sender
        - receiver
        - third
        
    Payer:
      enum:
        - sender
        - receiver
        - third
      type: string
      description: |-
        Плательщик по услуге.
        
        Доступные значения:
        
        - "sender" – отправитель;
        - "receiver" – получатель;
        - "third" – третье лицо.
        Если параметр не передан, то он принимает значение параметра "request.payment.primaryPayer"
        
        Количество плательщиков по всем услугам в заявке должно быть не более двух
      example: sender

    DocumentPhisical:
      type: object
      properties:
        type:
          type: string
          description: |-
            Тип документа
            Возможные значения:
            - "passport" – паспорт;
            - "drivingLicence" – водительское удостоверение;
            - "foreignPassport" – заграничный паспорт
          example: passport
        serial:
          type: string
          description: Серия документа.
          example: 1111
        number:
          type: string
          description: Номер документа. Формат номера зависит от страны.
          example: 123456
          
    AddressID:
      type: integer
      description: ID адреса из адресной книги Личного кабинета.
      example: 12345
      externalDocs:
        url: 'https://dev.dellin.ru/api/book/addresses/'
        description: Адреса
  
    FoundAddress:
      description: Данные по найденным адресам. Параметр присутствует в ответе, только если в запросе был передан параметр search.
      type: object
      properties:
        field:
          description: Объект, в котором был передан параметр "search"
          type: string
          example: "59.932031, 30.355628"
        source:
          description: Исходный адрес
          type: string
          example: "190000, Россия, г Санкт-Петербург, пр-кт Невский, дом 100"
        result:
          type: string
          description: Найденный адрес
          example: "delivery.arrival.address.search"
          
    InsuranceV2Request:
      required:
        - statedValue
      type: object
      description: "Информация о страховке груза https://www.dellin.ru/helpcenter/insurance"
      properties:
        statedValue:
          type: string
          format: decimal
          description: 'Объявленная стоимость груза, руб.'
          example: 1000
        term:
          type: boolean
          default: true
          description: Признак страхования срока доставки груза.
          example: true
        payer:
          $ref: '#/components/schemas/Payer'
          
    PaymentTypeEnum:
      example: cash
      enum:
        - cash
        - noncash
      type: string
      description: |-
        Вид оплаты
        - cash - cash
        - noncash - noncash
        
    DeliveryVariantDerival:
      enum:
        - terminal
        - address
      type: string
      example: address
      description: |-
        Способ доставки груза
        - terminal - доставка груза от/до терминала. __Примечание.__ При заказе перевозки малогабаритного груза (значение параметра запроса "delivery.deliverуType.type" – "small") доставка от/до терминала невозможна.
        - address - доставка груза от/до адреса; 
        
         Для объекта "request.delivery.derival": при выборе доставки от адреса отправителя будет оформлен заказ, при выборе доставки от терминала отправителя – [предзаказ](https://www.dellin.ru/preorder_page/) 
         
    DeliveryVariantArrival:
      enum:
        - terminal
        - address
        - airport
      type: string
      example: address
      description: |-
        Способ доставки груза
        - terminal - доставка груза от/до терминала. __Примечание.__ При заказе перевозки малогабаритного груза (значение параметра запроса "delivery.deliverуType.type" – "small") доставка от/до терминала невозможна.
        - address - доставка груза от/до адреса; 
        - airport - доставка груза до аэропорта, вариант используется, если в городе, в который необходимо доставить груз, нет терминала "Деловых Линий", в этом случае груз можно получить на грузовом терминале в аэропорту.
        
         Для объекта "request.delivery.derival": при выборе доставки от адреса отправителя будет оформлен заказ, при выборе доставки от терминала отправителя – [предзаказ](https://www.dellin.ru/preorder_page/) 
      
    TerminalID:
      type: string
      description: ID терминала 
      example: 89
      externalDocs:
        url: 'https://dev.dellin.ru/api/terminals/directory/'
        description: Справочник терминалов
        
    Requirements:
      type: array
      description: |-
        Дополнительные требования к транспорту. 
        
        Массив UID видов погрузки/дополнительных требований к транспорту.

        UID'ы можно получить в [Справочнике специальных требований к транспорту](https://dev.dellin.ru/api/catalogs/directories/#_header20) и [Справочнике видов загрузки](https://dev.dellin.ru/api/catalogs/directories/#_header15)
      example:
        - '0x9951e0ff97188f6b4b1b153dfde3cfec'
        - '0x88f93a2c37f106d94ff9f7ada8efe886'
      items:
        type: string 
        
    Address:
      type: object
      description: Адрес
      properties:
        search:
          type: string
          maxLength: 1024
          minLength: 2
          description: Адрес в виде текста или координат.
          example: '59.924501, 30.241762'
        street:
          type: string
          description: Код КЛАДР улицы.
          example: '7800000000008850000000000'
        house:
          type: string
          maxLength: 7
          description: Номер дома. 
          example: 5
        building:
          type: string
          
          maxLength: 5
          description: Корпус.
          example: 1
        structure:
          type: string
          
          maxLength: 7
          description: Строение.
          example: лит.А
        flat:
          type: string
          
          maxLength: 5
          description: Квартира.
          example: 214а
          
    DeliveryWorkTime:
      type: object
      description: Время забора или отвоза груза
      properties:
        worktimeStart:
          type: string
          format: time
          description: Начало периода передачи груза.
          example: '9:30'
        worktimeEnd:
          type: string
          format: time
          description: Окончание периода передачи груза.
          example: '19:00'
        breakStart:
          type: string
          format: time
          
          description: Начало перерыва.
          example: '12:00'
        breakEnd:
          type: string
          format: time
          
          description: Окончание перерыва.
          example: '13:00'
        exactTime:
          type: boolean
          
          default: false
          description: Передача груза в точное время.
          example: false
        
    DeliveryHandling:
      type: object
      description: Погрузо-разгрузочные работы на адресе
      properties:
        freightLift:
          type: boolean
          default: false
          description: Флаг, обозначающий, что есть грузовой лифт.
          example: false
        toFloor:
          type: integer
          description: 'Номер этажа, на который необходимо поднять груз'
          example: 2
        carry:
          type: integer
          description: 'Расстояние, на которое необходимо перенести груз (в метрах)'
          example: 10
          
    ActionEnum:
      enum:
        - send
        - return
      type: string
      example: send
      description: |-
        Возможные значения
        - send - send
        - return - return

#Перевозка сборных грузов    
    V2Request:
      type: object
      required: [appkey, delivery, members, cargo, payment]
      properties:
        appkey:
          $ref: '#/components/schemas/AppKey'
        sessionID:
          $ref: '#/components/schemas/SessionID'
        inOrder: 
          type: boolean
          default: true
          description: |-
            Если передано значение "false", то заявка сохраняется, но не передается в дальнейшую обработку (необходимо, например, в случае, если заявку будет включена в состав мультизаявки).

            Значение по умолчанию: "true".
            
            Если пользователь не авторизован, то параметр игнорируется
        delivery:
          $ref: '#/components/schemas/V2RequestDelivery'
        members:
          $ref: '#/components/schemas/V2RequestMembers'
        cargo:
          $ref: '#/components/schemas/V2RequestCargo'
        payment:
          $ref: '#/components/schemas/V2RequestPayment'
        cargoCode:
          type: string
          maxLength: 100
          description: Номер ТТН клиента
          
      xml:
        name: request
          
    V2RequestMembers:
      type: object
      description: Участники перевозки
      properties:
        requester:
          $ref: '#/components/schemas/Requester'
        sender:
          $ref: '#/components/schemas/Member'
        receiver:
          $ref: '#/components/schemas/MemberReceiver'
        third:
          $ref: '#/components/schemas/Member'
        signer:
          $ref: '#/components/schemas/MemberSigner'
      required: [requester, sender, receiver]

        
        
    Member:
      type: object
      description: Полные реквизиты участника перевозки
      properties:
        counteragentID:
          type: integer
          description: |-
            ID контрагента из адресной книги.
            *Если пользователь не авторизован, то параметр игнорируется. Если пользователь авторизован, то передача одного из взаимоисключающих параметров "counteragentID" или "counteragent" является обязательной
          example: '0x92EE03691F25A9FE4BE9910CD87CA9CA'
          externalDocs:
            url: 'https://dev.dellin.ru/api/book/counteragents/'
            description: Список контрагентов из адресной книги
          
        counteragent:
          $ref: '#/components/schemas/Counteragent'
        contactIDs:
          description: |-
            Список ID контактных лиц из [Адресной книги](https://dev.dellin.ru/api/book/contact-details/).

            Максимальное количество элементов в массиве – 3.
            
            *Параметр игнорируется для контрагента – "анонимного" получателя (1). Также параметр игнорируется, если пользователь не авторизован. Если пользователь авторизован и контрагент не является анонимным получателем, то передача одного из взаимоисключающих параметров "contactIDs" или "contactPersons" является обязательной
          type: array
          items:
            type: integer
            
        contactPersons:
          description: Список контактных лиц. Для авторизованных пользователей максимальное количество элементов в массиве - 3, для неавторизованных - 1
          type: array
          items:
            $ref: '#/components/schemas/ContactPerson'
        phoneIDs:
          description: |-
            Список ID телефонных номеров из [Адресной книги](https://dev.dellin.ru/api/book/contact-details/).

            Максимальное количество элементов в массиве – 3. 
            
            *Параметр игнорируется для контрагента – "анонимного" получателя (1). Также параметр игнорируется, если пользователь не авторизован. Если пользователь авторизован и контрагент не является анонимным получателем, то передача одного из взаимоисключающих параметров "phoneIDs" или "phoneNumbers" является обязательной
          
          type: array
          items:
            type: integer
        phoneNumbers:
          type: array
          items:
            $ref: '#/components/schemas/PhoneNumber'
        email:
          description: Email для отправки уведомлений участнику перевозки
          type: string
          format: email
        dataForReceipt:
          $ref: '#/components/schemas/DataForReceipt'


    MemberReceiver:
      type: object
      description: Полные реквизиты участника перевозки
      properties:
        counteragentID:
          type: integer
          description: |-
            ID контрагента из адресной книги.
            *Если пользователь не авторизован, то параметр игнорируется. Если пользователь авторизован, то передача одного из взаимоисключающих параметров "counteragentID" или "counteragent" является обязательной
          example: '0x92EE03691F25A9FE4BE9910CD87CA9CA'
          externalDocs:
            url: 'https://dev.dellin.ru/api/book/counteragents/'
            description: Список контрагентов из адресной книги
          
        counteragent:
          $ref: '#/components/schemas/CounteragentReceiver'
        contactIDs:
          description: |-
            Список ID контактных лиц из [Адресной книги](https://dev.dellin.ru/api/book/contact-details/).

            Максимальное количество элементов в массиве – 3.
            
            *Параметр игнорируется для контрагента – "анонимного" получателя (1). Также параметр игнорируется, если пользователь не авторизован. Если пользователь авторизован и контрагент не является анонимным получателем, то передача одного из взаимоисключающих параметров "contactIDs" или "contactPersons" является обязательной
          type: array
          items:
            type: integer
            
        contactPersons:
          description: Список контактных лиц. Для авторизованных пользователей максимальное количество элементов в массиве - 3, для неавторизованных - 1
          type: array
          items:
            $ref: '#/components/schemas/ContactPerson'
        phoneIDs:
          description: |-
            Список ID телефонных номеров из [Адресной книги](https://dev.dellin.ru/api/book/contact-details/).

            Максимальное количество элементов в массиве – 3. 
            
            *Параметр игнорируется для контрагента – "анонимного" получателя (1). Также параметр игнорируется, если пользователь не авторизован. Если пользователь авторизован и контрагент не является анонимным получателем, то передача одного из взаимоисключающих параметров "phoneIDs" или "phoneNumbers" является обязательной
          
          type: array
          items:
            type: integer
        phoneNumbers:
          type: array
          items:
            $ref: '#/components/schemas/PhoneNumber'
        email:
          description: Email для отправки уведомлений участнику перевозки
          type: string
          format: email
        dataForReceipt:
          $ref: '#/components/schemas/DataForReceipt'

    MemberSigner:
      type: object
      required: [role]
      description: |-
        Информация об адресате электронного поручения экспедитору. Если параметр передан, будет сформирован черновик документа.
        Обязательно должен быть передан один из взаимоисключающих параметров: "lkEdoUID", "emails" или "eltcForwarderReqKind".
      properties:
        role:
          type: string
          enum: 
            - sender 
            - receiver
            - payer
          description: |-
            Роль адресата электронного поручения экспедитору (ЭПЭ) в грузоперевозке.
            * 'sender' – отправитель;
            * 'receiver' – получатель;
            * 'payer' – плательщик
        lkEdoUID:
          type: string
          description: |-
            UID личного кабинета системы электронного документооборота (для отправки черновика ЭПЭ), см. метод "[Доступные ЛК операторов ЭДО](https://dev.dellin.ru/api/catalogs/edms-accounts/)".
            Данные будут учтены, только если у пользователя есть [полный доступ](https://www.dellin.ru/articles/192/#full) к заказчику перевозки, заказчик перевозки выступает в качестве отправителя/получателя/плательщика, а также в качестве адресата ЭПЭ (значение параметра "members.requester.role" – "sender"/"reciver"/"payer", значение параметра "members.signer.role" совпадает со значением параметра "members.requester.role").
        emails:
          type: array
          description: |-
            Список адресов электронной почты (для отправки черновика ЭПЭ).
          items:
            type: string
        eltcForwarderReqKind:
          type: string
          enum: 
            - DRAFT 
            - SUPER_SERVICE
          description: |-
            Признак использования "Суперсервиса". Суперсервис – это услуга, в рамках которой компания "Деловые Линии" берет на себя задачи по оформлению электронных экспедиторских документов. Подробное описание услуги можно найти [на сайте "Деловых Линий"](https://www.dellin.ru/client/epd-script/#superservice)
            * 'DRAFT' – сервис не испольузется;
            * 'SUPER_SERVICE' – сервис используется
            Данные будут учтены, только если у пользователя есть [полный доступ](https://www.dellin.ru/articles/192/#full) к заказчику перевозки, заказчик перевозки выступает в качестве отправителя/получателя/плательщика, а также в качестве адресата ЭПЭ (значение параметра "members.requester.role" – "sender"/"reciver"/"payer", значение параметра "members.signer.role" совпадает со значением параметра "members.requester.role").
    
    Counteragent:
      type: object
      description: Реквизиты контрагента
      properties:
        form:
          type: string
          description: |-
              Найти ОПФ можно при помощи метода [Поиск ОПФ](https://dev.dellin.ru/api/catalogs/opf/) или же метода [Поиск контрагентов](https://dev.dellin.ru/api/book/counteragents/#_header30)
              
              *Передача одного из взаимоисключающих параметров "form" или "customForm" является обязательной. При этом параметр "customForm" следует использовать только в том случае, если не удалось найти нужную ОПФ в справочнике
          
        customForm:
          $ref: '#/components/schemas/CustomForm'
        document:
          $ref: '#/components/schemas/DocumentPhisical'
        name:
          type: string
        inn:
          type: string
        juridicalAddress:
          $ref: '#/components/schemas/Address'
        save:
          type: boolean
          default: false

    CounteragentReceiver:
      type: object
      description: Реквизиты контрагента
      properties:
        form:
          type: string
          description: |-
              Найти ОПФ можно при помощи метода [Поиск ОПФ](https://dev.dellin.ru/api/catalogs/opf/) или же метода [Поиск контрагентов](https://dev.dellin.ru/api/book/counteragents/#_header30)
              
              *Передача одного из взаимоисключающих параметров "form" или "customForm" является обязательной. При этом параметр "customForm" следует использовать только в том случае, если не удалось найти нужную ОПФ в справочнике
          
        customForm:
          $ref: '#/components/schemas/CustomForm'
        document:
          $ref: '#/components/schemas/DocumentPhisical'
        isAnonym:
          type: boolean
          default: false
        phone:
          type: string
          description: Телефон «анонимного» получателя
        name:
          type: string
        inn:
          type: string
        juridicalAddress:
          $ref: '#/components/schemas/Address'
        save:
          type: boolean
          default: false
          
          
    CustomForm:
      type: object
      properties:
        formName:
          type: string
        countryUID:
          type: string
        juridical:
          type: boolean
    ContactPerson:
      type: object
      properties:
        id:
          type: integer
          
        name:
          type: string
        save:
          type: boolean
          default: false

    PhoneNumber:
      type: object
      description: |-
        Список телефонных номеров.

        Для авторизованных пользователей максимальное количество элементов в массиве – 3, для неавторизованных – 1.
        
        *Параметр игнорируется для контрагента – "анонимного" получателя (1). Если пользователь не авторизован, то параметр является обязательным. Если пользователь авторизован и контрагент не является анонимным получателем, то передача одного из взаимоисключающих параметров "phoneIDs" или "phoneNumbers" является обязательной
              type: object
      properties:
        number:
          type: string
          description: |-
            Номер телефона. Максимальная длина поля – 15 цифр
          maxLength: 15
        ext:
          type: string
          description: |-
            Добавочный номер. Максимальная длина поля – 5 цифр
          maxLength: 5
        save:
          type: boolean
          default: false
          description: |-
            Признак сохранения объекта в адресную книгу.

            Значение по умолчанию: "false".
            
            Параметр игнорируется для третьего лица. Параметр игнорируется для неавторизованных пользователей
          
    DataForReceipt:
      required: 
        - send
      type: object
      description: |-
        Контактные данные для отправки электронного чека плательщику – физическому лицу
    
          *Параметр обязателен для контрагента – физического лица, являющегося плательщиком и не являющегося "анонимным" получателем. Для контрагента – "анонимного" получателя и для контрагента – юридического лица параметр не является обязательным и игнорируется
      properties:
        send:
          type: boolean
          description: |-
              Согласие на получение электронного чека об оплате. 
              
              Доступные значения:
              - "true" – пользователь ввел "phone" и/или "email" для отправки чека;
              - "false" – пользователь отказался предоставлять контактные данные для отправки чека
        phone:
          type: string
          description: |- 
            Номер телефона для отправки чека.

            Формат номера: "+79XXXXXXXXX" (12 символов: начинается с "+79" и далее 9 цифр)
            
              - Если "send" = "true", то обязательна передача хотя бы одного из параметров: "phone" или "email"
            
              - Если "send" = "false", то параметр игнорируется
        email:
          type: string
          description: |- 
            Email адрес для отправки чека

            - Если "send" = "true", то обязательна передача хотя бы одного из параметров: "phone" или "email"
            
            - Если "send" = "false", то параметр игнорируется

    CashOnDelivery:
      type: object
      description: Наложенный платеж (описание услуги см. [на сайте](https://www.dellin.ru/cash-on-delivery/) компании).
      properties:
        orderNumber:
          type: string
          description: |-
            Внутренний номер заказа клиента (например, номер заказа интернет-магазина)

            Параметр может быть использован для передачи внутреннего номера заказа не только в случае оплаты наложенным платежом. При этом соблюдение прочих условий, необходимых для оформления услуги "наложенный платёж", не требуется, см. [пример 3](https://dev.dellin.ru/api/examples/request/#_header8) в разделе "Оформление заказа"
        orderDate:
          type: string
          format: date
          description: |-
            Дата заказа. Формат: "ГГГГ-ММ-ДД"
        paymentType:
          type: string
          description: |-
            Заявленный вид оплаты.

              Доступные значения:
              
              - "cash" – оплата наличными;
              - "card" – оплата картой
          enum:
            - cash
            - card
        products:
          description: Описание номенклатурного состава груза
          type: array
          items:
            $ref: '#/components/schemas/Product'
            
    Product:
      type: object
      properties:
        productName:
          type: string
          description: Наименование товара
        productCode:
          type: string
          description: Номенклатурный номер (артикул)
        productAmount:
          type: integer
          description: |-
            Количество. При оформлении наложенного платежа общая сумма по заказу (то есть сумма произведений значений параметров "costWithVAT" и "productAmount" каждого из элементов массива "CashOnDelivery.products") должна быть целым числом
        costWithVAT:
          type: number
          format: float
          description: Цена за ед. с НДС, руб.
        VATRate:
          type: integer
          description: |-
            Ставка НДС, %.

            Доступные значения:
            
            - "0";
            - "10";
            - "22".
            
            Если товар не облагается НДС, то следует передавать не нулевое значение, а просто не передавать параметр
          enum:
            - 0
            - 10
            - 22
            
    V2RequestResponse:
      type: object
      properties:
        MetaData:
          $ref: '#/components/schemas/MetaData'
        data:
          type: object
          properties:
            state:
              type: string
              description: 'Статус обработки запроса'
            requestID:
              type: integer
              description: Номер созданной заявки/предзаказа
            barcode:
              type: string
              description: Штрих-код (для предзаказа)
            information:
              type: array
              items:
                type: string
            addressBook:
              $ref: '#/components/schemas/AddressBook'
            foundAddresses:
              type: array
              items:
                $ref: '#/components/schemas/FoundAddress'

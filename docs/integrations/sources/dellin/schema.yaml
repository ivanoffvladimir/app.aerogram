#Местоположения

    CitiesRequest:
      type: object
      required: 
        - appkey
      properties:
        appkey: 
          $ref: '#/components/schemas/AppKey' 
        cityID:  
          type: string
          example: 200555
          description: |-
              ID города из [Справочника населенных пунктов](https://dev.dellin.ru/api/places/directories/). Обязательна передача одного из взаимоисключающих параметров : "cityID", "code" или "q"
        code:    
          type: string
          example: "7700000000000000000000000"
          description: |- 
              Код КЛАДР города из [Справочника населенных пунктов](https://dev.dellin.ru/api/places/directories/). Обязательна передача одного из взаимоисключающих параметров: "cityID", "code" или "q"
        q:       
          type: string
          example: Мос          
          description: |- 
              Часть названия города. Обязательна передача одного из взаимоисключающих параметров: "cityID", "code" или "q"
      xml: 
        name: request 
        
    CitiesResponse:
      type: object
      required: 
        - cities
      properties:
        cities:
          type: array
          items: 
            $ref: '#/components/schemas/City' 
          
    City:
      type: object
      properties:
        code:         
          type: string 
          description:   Код КЛАДР населенного пункта   
          example: "7700000000000000000000000"
        aString:      
          type: string
          description: Полное название населенного пункта с указанием его типа ("г.", "пгт" и т. п.)
          example: "г. Москва"         
        isTerminal:   
          type: integer
          description: |-
              Признак наличия терминалов в населенном пункте.

              Возможные значения:
              
              - "1" - в населенном пункте есть терминалы;
              - "0" - в населенном пункте нет терминалов
          example: 1   
        regionID:     
          type: integer
          description: ID региона (субъекта РФ), к которому относится населенный пункт  
          example: 75              
        zoneID:       
          type: integer 
          description: ID административного округа. При отсутствии данных принимает значение "0"
          example: 0   
        cityID:       
          type: integer
          description: ID города из [Справочника населенных пунктов](https://dev.dellin.ru/api/places/directories/) 
          example: 200555
        searchString: 
          type: string
          description: Название населенного пункта без указания его типа 
          example: "Москва" 
        cityUID:       
          type: string
          description: ID города из [Справочника населенных пунктов](https://dev.dellin.ru/api/places/directories/)
          example: "0x834f00112fdd658311da4c6326ef0e13"           
        postalCode:    
          type: integer 
          description: Почтовый индекс 
          example: null  
        inPrice:      
          type: integer
          description: Параметр присутствует в ответе, но в настоящее время не используется 
          example: 1
        region_name:  
          type: string 
          description: Название региона (субъекта РФ), к которому относится населенный пункт     
          example:  "г. Москва" 
        street:        
          type: integer
          description: |-
            Признак наличия улиц в населенном пункте.
  
            Возможные значения:
            
            - "1" - в населенном пункте возможно наличие улиц;
            - "0" - в населенном пункте нет улиц
          example: 1




          description: |-
              ID города из [Справочника населенных пунктов](https://dev.dellin.ru/api/places/directories/).
          example: 200601
        search:
          type: string
          minLength: 2
          maxLength: 1024
          description: |-
            Адрес в виде текста или координат. Обязательна передача одного из взаимоисключающих параметров: "code", "cityID" или "search"

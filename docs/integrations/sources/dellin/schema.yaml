    WebhookUpdateRequest:
      type: object
      required: [appkey, sessionID, url, orderRoles ]
      properties:
        appkey:    
          $ref: '#/components/schemas/AppKey' 
        sessionID: 
          $ref: '#/components/schemas/SessionID'
        id:
          type: integer
          description: Идентификатор подписки. *Параметр обязателен в случае передачи запроса на изменение существующей подписки
          example: 2
        url:
          type: string
          format: uri
          description: Адрес, на который должны отправляться уведомления (схема https)
          example: https://webhook.site
          
        eventTypes:
          type: array
          description: |-
            Массив типов событий, о которых необходимо отправлять уведомления.

            Формат типа события: "<сущность>.<группа событий>.<событие>".
            
            Примеры:
            
            - "order.state.processing",
            - "order.state.declined",
            - "order.change.pickup_info"
            
            Перечень доступных типов (комбинаций сущности, группы и события) с их описанием можно получить с помощью справочника [Типы событий](https://dev.dellin.ru/api/catalogs/directories/).
            
            *Если параметр не передан, то подписка будет оформлена на все типы событий
          minItems: 1
          
          items:
            type: string
            example: order.state.pickup

        orderRoles:
          type: array
          description: |-
            Список ролей пользователей, которым необходимо отправлять уведомления.

            Доступные значения:
            
            - customer - заказчик,
            - sender - отправитель,
            - receiver - получатель,
            - payer - плательщик

          items:
            type: string
            example: "sender"
            enum: [customer, sender, receiver, payer]            

        state:
          type: string
          description: |-
            Параметр для управления статусом подписки.
  
            Доступные значения:
            
            - enabled - активировать,
            - disabled - отключить
            Значение по умолчанию: "enabled"
          example: enabled
          default: enabled
          enum: [enabled, disabled]  
      xml:
        name: request
        
    WebhookResponse:
      type: object
      properties:
        metadata:  
          $ref: '#/components/schemas/MetaData'
        data:
          $ref: '#/components/schemas/WebhookDataResponse'


    WebhooksResponse:
      type: object
      properties:
        metadata:  
          $ref: '#/components/schemas/MetaData'
        data:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WebhookDataResponse'

    WebhookDataResponse:
      type: object
      properties:
        id:
          type: integer
          description: Идентификатор подписки
          example: 2
        
        eventTypes:
          type: array
          description: |-
            Список событий, о которых будут отправляться уведомления (см. справочник [Типы событий](https://dev.dellin.ru/api/catalogs/directories/))
          minItems: 1
          
          items:
            type: string
            example: order.state.pickup

        orderRoles:
          type: array
          description: |-
            Список ролей пользователей, которым необходимо отправлять уведомления.

            Доступные значения:
            
            - customer - заказчик,
            - sender - отправитель,
            - receiver - получатель,
            - payer - плательщик

          items:
            type: string
            example: "sender"
            enum: [customer, sender, receiver, payer ]            

        state:
          type: string
          description: |-
            Статус подписки.
  
            Возможные значения:
            
            - enabled - активировать
            - disabled - отключить
            - error - остановлена (ошибка отправки уведомления)
            
            
            Статус "error" устанавливается для подписки, если возникла ошибка доставки уведомления на стороне получателя. В этом случае производится попытка повторной доставки этого уведомления через 1 минуту, 20 минут и 3 часа.Если 4 попытки доставки уведомлений (подряд) в рамках одной подписки оказались неудачными, то эта подписка автоматически отключается (ее статус меняется на "disabled")
          example: enabled

        url:
          type: string
          format: uri
          description: Адрес, на который будут отправляться уведомления
          example: https://webhook.site
      xml:
        name: response


    WebhooksOrdersRequest:
      type: object
      required:  [appkey, sessionID, orderNumbers]
      properties:
        appkey:    
          $ref: '#/components/schemas/AppKey' 
        sessionID: 
          $ref: '#/components/schemas/SessionID'
        orderNumbers:
          type: array
          minItems: 1
          maxItems: 5
          description: |-
            Массив номеров заказов для добавления в подписку.

            Максимальное количество номеров в массиве - 5.
            
            Номер заказа по одному из следующих параметров можно получить с помощью метода [Журнал заказов](https://dev.dellin.ru/api/orders/search/):
            - номер накладной,
            - номер заявки экспедитора,
            - внешний номер заказа
          items:
            type: string
            example: "8216702228554"
      xml:
        name: request
        
        
    WebhooksOrdersResponse:
      type: object
      description: Результат операции добавления / удаления заказов
      properties:
        metadata:  
          $ref: '#/components/schemas/MetaData'
      xml:
        name: response

    WebhooksDeleteRequest:
      type: object
      required: [appkey, sessionID, ids]
      properties:
        appkey:    
          $ref: '#/components/schemas/AppKey' 
        sessionID: 
          $ref: '#/components/schemas/SessionID'
        ids:
          type: array
          minItems: 1
          description: Массив идентификаторов удаляемых подписок
          items:
            type: integer
            example: 1

    WebhooksDeleteResponse:
      type: object
      properties:
        metadata:  
          $ref: '#/components/schemas/MetaData' 

              
    WebhookOrdersRequest:
      type: object
      required: [appkey, sessionID]
      properties:
        appkey:    
          $ref: '#/components/schemas/AppKey' 
        sessionID: 
          $ref: '#/components/schemas/SessionID'          
        orderNumber:
          type: string
          description: |-
            Номер заказа.

            Используется для проверки того, добавлен ли заказ с определенным номером в подписку. В случае передачи этого параметра информация о других заказах в ответ не выводится.
            
            Если параметр не передан, то в ответ выводится массив номеров заказов, добавленных в данную подписку.
          example: "8216702228554"
        page:
          type: integer
          description: Номер страницы
          example: 2
        perPage:
          type: integer
          description: |-
            Количество элементов на страницу.
    
            Минимальное значение: 1,
            
            Максимальное значение: 100
          example: 10
          default: 100
          
          
          
    WebhookOrdersResponse:
      type: object
      required: [metadata, data]
      properties:
        metadata: 
          $ref: '#/components/schemas/MetaDataWebhook' 
        orders:
          type: array
          description: |-
            Если в запросе не был передан номер заказа в параметре "orderNumber", то в этом параметре выводится массив номеров заказов, добавленных в данную подписку.
  
            Если был передан, то выводится:
            
            - переданный номер заказа, если он добавлен в данную подписку;
            - пустой массив, если не добавлен
          items: 
            type: string 
          example:
            - "8216702228554"
            - "8217711111041"          


    MetaDataWebhook:
      type: object
      properties:
        status:
          type: integer
          description: Эмуляция http-кода состояния. В случае успешного выполнения возвращается код "200" (OK)
          example: 200
        generatedAt:
          type: string
          description: |-
            Дата и время генерации ответа сервера. Формат: "ГГГГ-ММ-ДД ЧЧ:ММ:СС"
          example: "2025-06-01 13:24:54"   
        currentPage:
          type: integer
          description: Номер текущей страницы ответа
          example: 1
        nextPage:
          type: integer
          description: Номер следующей страницы ответа
          example: 2
        prevPage:
          type: integer
          description: Номер предыдущей страницы ответа. Если номер текущей страницы ответа – "1", то значение данного параметра – "null"
          example: null
        totalPages:
          type: integer
          description: Страниц всего
          example: 41     

    WebhookEventsResponse:
      type: object
      properties:
        metadata:  
          $ref: '#/components/schemas/MetaData'
        data:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WebhookDataEventsResponse'

    WebhookDataEventsResponse:
      type: object
      properties:
        key:
          type: string
          description: |-
            Тип события.

            Формат: <сущность>.<группа событий>.<событие>
            
            Примеры:
            
            "order.state.processing",
            "order.state.declined",
            "order.change.pickup_info"
            Перечень и описание всех возможных событий см. в [документации](https://dev.dellin.ru/api/catalogs/directories/#:~:text=%D0%92%20%D0%BD%D0%B8%D0%B6%D0%B5%D1%81%D0%BB%D0%B5%D0%B4%D1%83%D1%8E%D1%89%D0%B5%D0%B9%20%D1%82%D0%B0%D0%B1%D0%BB%D0%B8%D1%86%D0%B5%20%D0%BF%D1%80%D0%B8%D0%B2%D0%B5%D0%B4%D0%B5%D0%BD%D1%8B%20%D0%B2%D0%BE%D0%B7%D0%BC%D0%BE%D0%B6%D0%BD%D1%8B%D0%B5%20%D0%B7%D0%BD%D0%B0%D1%87%D0%B5%D0%BD%D0%B8%D1%8F%20%D1%82%D0%B8%D0%BF%D0%BE%D0%B2%20%D1%81%D0%BE%D0%B1%D1%8B%D1%82%D0%B8%D0%B9)
          example: "order.state.processing"
        
  
        description:
          type: string
          description: |-
            Наименование события.
          example: "Заказ в обработке" 
          
        public:
          type: boolean
          description: |-
            Признак доступности подписки на событие для пользователя, не являющегося участником перевозки.

            Возможные значения:
            
            - True – доступно всем,
            - False – доступно только участникам перевозки
          example: true          
        
#Печатные формы
    PrintableFormRequest:
      type: object
      required: [appkey, sessionID, docUID, mode]
      properties:
        appkey:    
          $ref: '#/components/schemas/AppKey' 
        sessionID: 
          $ref: '#/components/schemas/SessionID'
        docUID:
          type: string
          description: |-
            UID накладной / накладной, с который связаны счёт / счёт фактура / накладная на выдачу. UID можно узнать при помощи метода [Журнал заказов](https://dev.dellin.ru/api/orders/search/): это значение параметра ответа "orders.documents.uid" из блока, где значение параметра "orders.documents.type" - "shipping"
          example: "0xad339ac31247666145816f2aeb4935ab"
        mode:
          type: string
          description: |-
            Тип формы документа.

            Доступные значения:
              - bill – счёт  
              - order – накладная  
              - invoice – счёт-фактура  
              - giveout – накладная на выдачу
              
              Информация о счёте-фактуре доступна только плательщику по накладной при наличии полного доступа к контрагенту с ролью "плательщик" из накладной (см. [Список контрагентов](https://dev.dellin.ru/api/auth/counteragents/))
          enum: [bill, order, invoice, giveout]
      xml:
        name: request

    PrintableFormResponse:
      type: object
      properties:
        metadata: 
          $ref: '#/components/schemas/MetaData'
        data:
          type: array
          description: Список документов, полученных по запросу
          items:
            $ref: '#/components/schemas/PrintableDocument'
      xml:
        name: response
        
    PrintableDocument:
      type: object
      properties:
        uid:
          type: string
          description: UID документа
          example: "0x819400505683398711e9e43200791660"
        base64:
          type: string
          description: Pdf-документ в формате base64 
          example: "JVBERi0xLjQKJeLjz9MKMSAwIG9i.."
        url:
          type: array
          description: |-
            Ссылка для скачивания документа. Ссылка доступна только для накладных на выдачу (значение параметра запроса "mode" - "giveout")
          items:
            type: string
            example: "https://assets.dellin.ru/assets/api_cache/giveout_orders/2015/681/original/1e56-252e-40aae5-37c0b.jpg"


    PickupFormRequest:

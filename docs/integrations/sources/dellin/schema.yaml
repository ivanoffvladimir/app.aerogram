        settlement_kladr_id: 
          type: string
          description: Код КЛАДР населенного пункта
          example: ""
        settlement_with_type:  
          type: string
          description: Наименование населенного пункта с указанием типа
          example: ""
        source:              
          type: string
          description: Исходный адрес одной строкой
          example: "Свердловская обл, г. Березовский, тер. п.Первомайский, с 24 к 5"
        street:              
          type: string 
          description: Улица
          example: "п.Первомайский"
        street_kladr_id:     
          type: string
          description: Код КЛАДР улицы
          example: "6600000300005920000000000"
        street_with_type:    
          type: string
          description: Наименование улицы с указанием типа
          example: "тер п.Первомайский"
        result:              
          type: string
          description: Стандартизированный адрес одной строкой. Если по исходному адресу не определен номер дома, но определен номер корпуса и/или строения, то одно из этих значений (более высокого уровня по иерархии адреса) будет выведено в этом параметре как номер дома («д.»)
          example: "623704, Россия, обл Свердловская, г Березовский, тер п.Первомайский, д. 5, стр. 24"
        house_data:
          type: object
          description: Информация о доме
          properties:
            house_number:  
              type: string
              description: Номер дома
              example: null
            fraction:      
              type: string
              description: Дробь
              example: null
            letter:        
              type: string
              description: Литера
              example: null
            building:      
              type: string
              description: Корпус
              example: "5"
            structure:     
              type: string
              description: Строение
              example: "24"


    ArrivalSfRequest:
      type: object
      description: Информация о доставке до адреса получателя. Допускается передача пустого объекта.
      properties:
        addressID:
          $ref: '#/components/schemas/AddressID'
        address:
          $ref: '#/components/schemas/Address'
        time:
          type: object
          properties:

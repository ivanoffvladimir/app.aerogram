      summary: Пример 4 (Адрес - Адрес)
      description: |- 
        Пример запроса оформления заказа от адреса отправителя до адреса получателя.

        
        __Для выполнения примера запроса скорректируйте:__
        - Дату отгрузки (__produceDate__)
        - Идентификатор заказчика (__members.requester.uid__). Получить идентификатор можно с помощью метода [Список контрагентов](https://dev.dellin.ru/api/swagger/#/%D0%90%D0%B2%D1%82%D0%BE%D1%80%D0%B8%D0%B7%D0%B0%D1%86%D0%B8%D1%8F%20%D0%BF%D0%BE%D0%BB%D1%8C%D0%B7%D0%BE%D0%B2%D0%B0%D1%82%D0%B5%D0%BB%D1%8F/v2_counteragents_create)  
        
              
        __Параметры в примере:__ 
        
        - Пользователь авторизован -  Нет
        - Роль пользователя в перевозке  -   Отправитель
        - Условия доставки - От адреса отправителя до адреса получателя
        - Вид перевозки  - Автоперевозка
        - Количество грузовых мест -  1
        - Дополнительно:
            - Перевозка негабаритного груза (1)
            - Заезд на второй адрес при отправке груза
        - Плательщик  - Основной плательщик – третье лицо, услугу доставки до адреса оплачивает отправитель (2)
        
        __Примечания:__

          __1.__ Негабаритное грузовое место – это:

            - При авиаперевозке, если заказана жесткая упаковка (2): грузовое место, вес которого до упаковки больше 53 кг либо хотя бы одно из измерений (Д х Ш х В) которого до упаковки больше 1,2 х 0,9 х 0,65 м соответственно;
            
            - В остальных случаях: грузовое место, хотя бы одна из весогабаритных характеристик которого (длина, ширина, высота или вес) превышает соответствующее значение из ответа метода [Параметры негабаритного груза](https://dev.dellin.ru/api/catalogs/parametry-negabaritnogo-gruza/) с учетом вида доставки ("request.delivery.deliveryType.type"), на дату, указанную в параметре "request.delivery.derival.produceDate" (см. [Перевозка сборных грузов](https://dev.dellin.ru/api/ordering/ltl-request/)).
          __2.__  В запросе передан параметр "delivery.arrival.sender", см. [Перевозка сборных грузов](https://dev.dellin.ru/api/ordering/ltl-request/)
        

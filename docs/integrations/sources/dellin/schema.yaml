    V2RequestExample03:
      summary: Пример 2 (Малогабаритный груз)
      description: |- 
        Пример запроса оформления заказа Доставка малогабаритного груза от адреса отправителя до адреса получателя.

        
        __Для выполнения примера запроса скорректируйте:__
        - Дату отгрузки (__produceDate__)
        - Идентификатор заказчика (__members.requester.uid__). Получить идентификатор можно с помощью метода [Список контрагентов](https://dev.dellin.ru/api/swagger/#/%D0%90%D0%B2%D1%82%D0%BE%D1%80%D0%B8%D0%B7%D0%B0%D1%86%D0%B8%D1%8F%20%D0%BF%D0%BE%D0%BB%D1%8C%D0%B7%D0%BE%D0%B2%D0%B0%D1%82%D0%B5%D0%BB%D1%8F/v2_counteragents_create)  
        
                
        __Параметры в примере:__
        
        - Пользователь авторизован -  Да
        
        - Роль пользователя в перевозке  - Третье лицо
        
        - Условия доставки -  От адреса отправителя до адреса получателя
        
        - Вид перевозки  - Доставка малогабаритного груза (1)
        
        - Количество грузовых мест -  1
        
        - Упаковка -  Картонная коробка (2)

        - Дополнительно: Указано точное время доставки груза (3) и Упрощённая отправка (4)
        
        - Плательщик  Получатель
        
        
        __Примечания:__
        
          __1.__ Малогабаритный груз – это груз, параметры которого не превышают следующие значения:
          - масса меньше либо равна 30 кг;
          - Д*Ш*В меньше либо равны 0,54*0,39*0,39 м;
          - объём меньше либо равен 0,1 куб. м.
          
          Заказ услуги "Доставка малогабаритного груза" возможен только в случае, если в городах отправки и получения есть подразделения компании "Деловые Линии", более подробную информацию см. на [сайте компании](https://www.dellin.ru/ltl/parcels/)
          
          __2.__ См. справочник [Дополнительные услуги](https://dev.dellin.ru/api/catalogs/directories/#_header9)
          
          __3.__ Значение параметра запроса "delivery.arrival.time.exactTime" – "true", см. [Перевозка сборных грузов](https://dev.dellin.ru/api/ordering/ltl-request/)
          
          __4.__ Значение параметра запроса "members.receiver.counteragent.isAnonym" – "true", см. [Перевозка сборных грузов](https://dev.dellin.ru/api/ordering/ltl-request/)
    

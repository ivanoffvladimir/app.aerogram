    Base64Response:
      type: object
      properties:
        base64:
          type: string
          description: Документ в формате base64 
          example: "JVBERi0xLjQKJeLjz9MKMSAwIG9i.."        
      xml:
        name: response        

#Управление заказом 
    ChangeAvailableRequest:
      type: object
      required:  [appkey, sessionID, orderID]
      properties:
        appkey:    
          $ref: '#/components/schemas/AppKey'
        sessionID: 
          $ref: '#/components/schemas/SessionID'
        orderID:
          type: integer
          description: Номер заказа, по которому необходимо проверить возможность изменения данных
          example: "00000000"
          
    ChangeAvailableResponse:
      type: object
      properties:
        metadata: 
          $ref: '#/components/schemas/MetaData'
        data:
          type: object
          description: Информация о возможных изменениях по заказу
          properties:
            receiver:
              $ref: '#/components/schemas/ChangeInfo'
            payer:
              $ref: '#/components/schemas/ChangeInfoPayer'
            contactInfo:
              type: object
              description: Возможность изменения контактной информации
              properties:
                changeSender:
                  $ref: '#/components/schemas/ChangeInfo'
                changeReceiver:
                  $ref: '#/components/schemas/ChangeInfo'
            pickupInfo:
              $ref: '#/components/schemas/ChangeInfo'
            deliveryInfo:
              $ref: '#/components/schemas/ChangeInfo'
            suspend:
              $ref: '#/components/schemas/SuspendResume'
            resume:
              $ref: '#/components/schemas/SuspendResume'
            cancelPickup:
              $ref: '#/components/schemas/ChangeInfo'
            cancelDelivery:
              $ref: '#/components/schemas/ChangeInfo'

    ChangeInfo:
      type: object
      description: Информация о возможности изменения конкретного элемента заказа
      properties:
        available:
          type: boolean
          description: |-
            Флаг, обозначающий возможность изменения информации.
  
            Возможные значения:
            
            - "true" - данные можно изменить;
            - "false" - внесение изменений недоступно
        displayName:
          type: string
          description: Изменяемая информация
            
    ChangeInfoPayer:
      type: object
      description: Информация о возможности изменения конкретного элемента заказа
      properties:
        available:
          type: boolean
          description: |-
            Флаг, обозначающий возможность изменения информации.
  
            Возможные значения:
            
            - "true" - данные можно изменить;
            - "false" - внесение изменений недоступно
        displayName:
          type: string
          description: Изменяемая информация
        info:
          type: string
          description: Дополнительная информация по возможности изменения плательщика       
            
    SuspendResume:
      type: object
      description: Информация о приостановке или возобновлении выдачи груза
      properties:
        available:
          type: boolean
          description: |-
            Флаг, обозначающий возможность изменения информации.
  
            Возможные значения:
            
            - "true" - данные можно изменить;
            - "false" - внесение изменений недоступно
        displayName:
          type: string
          description: Изменяемая информация
        info:
          type: object
          description: Дополнительная информация по возможности изменения
          properties:
            terminalInfo:
              type: string
              description: Информация о терминале, на который прибудет груз
            availableTill:
              type: string
              format: date
              description: Дата до которой (включительно) возможна приостановка/возобновление выдачи груза
            warning:
              type: string
              description: |-
                Дополнительная информация, актуальная в случае, если дата, полученная в параметре "info.availableTill", будет передана в запросе метода на приостановку/возобновление выдачи в качестве значения параметра "suspendDate"/"resumeDate"
            terminalId:
              type: integer
              description: ID терминала, на который прибудет груз
            stateInfo:
              type: string
              description: Дополнительная информация



    ChangeReceiverRequest:
      type: object
      required: [appkey, sessionID, orderID, receiver, changeOrderPayer, storePayer]
      properties:
        appkey:    
          $ref: '#/components/schemas/AppKey'
        sessionID: 
          $ref: '#/components/schemas/SessionID'
        orderID:
          type: string
          description: Номер заказа
        receiver:
          $ref: '#/components/schemas/MemberChangeReceiver'
        changeOrderPayer:
          type: boolean
          description: Назначить нового получателя плательщиком
        storePayer:
          type: string
          enum: [sender, receiver, third]
          description: Кто оплачивает хранение
        third:
          $ref: '#/components/schemas/MemberChangeReceiver'
      xml: 
        name: request
        
    ChangeReceiverResponse:
      type: object
      properties:
        metadata: 
          $ref: '#/components/schemas/MetaData'
        data:
          type: object
          properties:
            status:
              type: string
              example: success
            foundAddresses:
              type: array
              items:
                $ref: '#/components/schemas/FoundAddress'
      xml: 
        name: response

    MemberChangeReceiver:
      type: object
      properties:
        counteragentID:
          type: integer
          description: ID контрагента из адресной книги
        counteragent:
          $ref: '#/components/schemas/CounteragentChangeReceiver'
        contactIDs:
          type: array
          items:
            type: integer
          description: ID контактных лиц
        contactPersons:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
        phoneIDs:
          type: array
          items:
            type: integer
        phoneNumbers:
          type: array
          items:
            type: object
            properties:
              number:
                type: string
              ext:
                type: string
        email:
          type: string
        dataForReceipt:
          type: object
          properties:
            phone:
              type: string
              description: Телефон для отправки чека
            email:
              type: string
              description: Email для отправки чека

    CounteragentChangeReceiver:
      type: object
      required: [form, name]
      properties:
        form:
          type: string
          description: UID ОПФ (организационно-правовой формы)
        document:
          type: object
          properties:
            type:
              type: string
              enum: [passport, drivingLicence, foreignPassport]
            serial:
              type: string
            number:
              type: string
        inn:
          type: integer
        name:
          type: string
        juridicalAddress:
          $ref: '#/components/schemas/Address'

 
    ChangePayerRequest:
      type: object
      required: [appkey, sessionID, orderID]
      properties:
        appkey:    
          $ref: '#/components/schemas/AppKey'
        sessionID: 
          $ref: '#/components/schemas/SessionID'
        orderID:
          type: string
          description: Номер заказа, по которому необходимо изменить плательщика
        docUID:
          type: string
          description: |-
            UID накладной. UID накладной можно уточнить при помощи метода [Журнал заказов](https://dev.dellin.ru/api/orders/search/).

            *Если по заказу было создано несколько накладных, параметр является обязательным
        counteragentUID:
          type: string
          description: |- 
            UID контрагента. У текущей учётной записи должен быть полный доступ к контрагенту или к грузоотправителю (см. метод [Список контрагентов](https://dev.dellin.ru/api/auth/counteragents/), описание параметра ответа "info.accessLevel")
            
            * Обязательно должен быть передан один из взаимоисключающих параметров: "counteragentUID" или "third" 
        third:
          $ref: '#/components/schemas/CounteragentChangePayer'
        contactIDs:
          type: array
          description: |-
            ID контактных лиц из [адресной книги](https://dev.dellin.ru/api/book/contact-details/)
            
            Максимальное количество элементов в массиве - 3
          items:
            type: integer
        contactPersons:
          type: array
          description: Данные контактных лиц. Максимальное количество элементов в массиве - 3
          items:
            type: object
            properties:
              name:
                type: string
                description: Имя контактного лица
        phoneIDs:
          type: array
          description: ID телефонов из [адресной книги](https://dev.dellin.ru/api/book/contact-details/)
          items:
            type: integer
        phoneNumbers:
          type: array
          description: |-
            Список телефонных номеров.

            Максимальное количество элементов в массиве - 3.
            
            *Обязательно должен быть передан один из взаимоисключающих параметров: "phoneIDs" или "phoneNumbers"
          items:
            type: object
            properties:
              number:
                type: string
                description: Номер телефона
              ext:
                type: string
                description: Добавочный номер
        dataForReceipt:
          type: object
          description: Контакты для отправки электронного чека
          properties:
            phone:
              type: string
              description: Телефон для чека
            email:
              type: string
              description: Email для чека
      xml: 
        name: request
        
    CounteragentChangePayer:
      type: object
      required: [form, name]
      properties:
        form:
          type: string
          description: UID организационно-правовой формы контрагента (ОПФ), см. [Поиск ОПФ](https://dev.dellin.ru/api/catalogs/opf/)
        document:
          type: object
          description: Паспортные данные (для физлиц)
          properties:
            type:
              type: string
              enum: [passport, drivingLicence, foreignPassport]
              description: |-
                  Тип документа.
                  
                  Доступные значения:
                  
                  - "passport" - паспорт;
                  - "drivingLicence" - водительское удостоверение;
                  - "foreignPassport" - заграничный паспорт. Для некоторых стран значение "foreignPassport" недоступно
            serial:
              type: string
              description: Серия документа
            number:
              type: string
              description: Номер документа
        inn:
          type: integer
          description: ИНН (обязательно для юрлиц)
        name:
          type: string
          description: Имя или наименование контрагента
        juridicalAddress:
          $ref: '#/components/schemas/Address'
 
    ChangePayerResponse:
      type: object
      properties:
        metadata: 
          $ref: '#/components/schemas/MetaData'
        data:
          type: object
          properties:
            status:
              type: string
              example: success
              description: Статус результата ("success" — заявка принята) 
      xml: 
        name: response
        
    ChangeContactsRequest:
      type: object
      required: [appkey, sessionID, orderID, members]
      properties:
        appkey:    
          $ref: '#/components/schemas/AppKey'
        sessionID: 
          $ref: '#/components/schemas/SessionID'
        orderID:
          type: string
          description: Номер заказа
        members:
          type: object
          description: Информация об изменяемых контактах
          properties:
            sender:
              $ref: '#/components/schemas/MemberChangeContacts'
            receiver:
              $ref: '#/components/schemas/MemberChangeContacts'
      xml: 
        name: request
        
    MemberChangeContacts:
      type: object
      description: Контактная информация участника перевозки
      properties:
        contactIDs:
          type: array
          items:
            type: integer
          description: |-

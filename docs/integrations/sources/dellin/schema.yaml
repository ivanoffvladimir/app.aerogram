  /v3/orders/change_available.{format}:
    post:
      tags:
      - Управление заказом
      summary: Доступные изменения
      description: |- 
        [Сервис](https://dev.dellin.ru/api/order/check/) позволяет проверить возможность:
  
          - смены получателя;
  
          - смены плательщика;
  
          - изменения способа оплаты;
  
          - изменения контактной информации по заказу;
  
          - изменения адреса отправки и доставки груза;
  
          - приостановки и возобновления выдачи;
  
          - отмены заявки на доставку от адреса отправителя;
  
          - отмены заявки на доставку до адреса получателя.
      operationId: change_available
      parameters:

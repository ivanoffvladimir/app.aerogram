            type: string 
          example: 
            - 1111
            - 2222
            - 3333
        comment:
          type: string
          description: "Комментарий. Максимум 300 символов"
          maxLength: 300
          example: "Текст комментария"
      xml: 
        name: request 

    BatchRequestResponse:         
      type: object
      properties:
        metadata: 
          $ref: "#/components/schemas/MetaData" 

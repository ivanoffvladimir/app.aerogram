  /v2/batch_request.{format}:     
    post:
      tags: 
        - Оформление заказов
      summary: "Пре-алерт : Оформление пакетного заказа" 
      description: |-
        __Для использования [метода](https://dev.dellin.ru/api/ordering/pre-alert/#_header2) необходимо связаться с менеджером Компании и сообщить о желании использовать решение "Пре-алерт".__
        
        
        __Пакетный заказ__ – объединение нескольких существующих заказов на доставку от терминала ([предзаказов](https://www.dellin.ru/articles/176/)) с целью ускорения процедуры обработки груза на терминале.  
        
        
        __Для каждого из объединяемых заказов должны выполняться условия:__
        
            1. Создан текущим пользователем.
            2. Создан с параметром "cargoCode" (см. Перевозка сборных грузов).
            3. Имеет единого грузоотправителя с остальными объединяемыми заказами.
            4. Находится в одном из следующих статусов:
                - В обработке.
                - Ожидает сдачи на терминал.
                - Груз принят к перевозке.
                - Груз принят к перевозке. Платное хранение.
                - Груз в пути.
                
      operationId: v2_batch_request_create
      parameters:
        - $ref: "#/components/parameters/format"
      requestBody:
        required: true
        content:
          application/json:
            schema: 
              $ref: "#/components/schemas/BatchRequest" 
          text/xml:
            schema: 
              $ref: "#/components/schemas/BatchRequest" 
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema: 
                $ref: "#/components/schemas/BatchRequestResponse"
            text/xml:
              schema: 
                $ref: "#/components/schemas/BatchRequestResponse"
        '400': 

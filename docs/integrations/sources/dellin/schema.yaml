            Время заказа пропуска для въезда на территорию отправителя.

            Доступные значения:
            
            - "1" – заказать за час;
            - "24" – заказать за сутки
        
        shipmentRegister:
          type: integer
          description: "Запись на отгрузку. Значение по умолчанию: false"
          default: false
        
        paidEntry: 
          type: object
          description: ДИнформация о платном въезде на территорию отправителя
          properties: 

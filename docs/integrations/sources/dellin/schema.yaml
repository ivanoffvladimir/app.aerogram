        "401":
          description: Unauthorized
          content:
            application/json:
              schema: 
                $ref: "#/components/schemas/Unauthorized"
            text/xml:
              schema: 
                $ref: "#/components/schemas/Unauthorized"
        "500": 
          description: Internal Server Error(Внутренняя ошибка сервера)
  
  /v2/request/cargo/shipment_labels.{format}:
    post:
      tags: 
        - Самомаркировка
      summary: Передача артикулов грузовых мест
      description: |-
        [Метод](https://dev.dellin.ru/api/marking/labels/#_header23) позволяет передать артикулы грузовых мест по одному заказу (и тем самым инициировать процесс генерации этикеток). Метод не позволяет отобразить на этикетках внутренний номер заказа, однако позволяет сформировать этикетки не только на груз, но и на сопроводительные документы (если при оформлении заявки была заказана услуга отправки/возврата сопроводительных документов, т. е. в запросе метода [Перевозка сборных грузов](https://dev.dellin.ru/api/swagger/#/%D0%9E%D1%84%D0%BE%D1%80%D0%BC%D0%BB%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%B7%D0%B0%D0%BA%D0%B0%D0%B7%D0%BE%D0%B2/v2_request) был передан параметр delivery.accompanyingDocuments).

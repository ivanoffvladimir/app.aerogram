      properties:
        statedValue:
          type: string
          format: decimal
          description: 'Объявленная стоимость груза, руб.'
          example: 1000
        term:
          type: boolean
          default: true
          description: Признак страхования срока доставки груза.
          example: true

        
         
        
    V2CalculatorResponse:
      type: object
      properties:
        MetaData:
          $ref: '#/components/schemas/MetaData'
        data:
          $ref: '#/components/schemas/CalculatorData'
      xml:
        name: response
        
    CalculatorData:
      type: object
      description: Информация о стоимости и сроках перевозки
      properties:
        derival:
          $ref: '#/components/schemas/DerivalArrivalResponse'
        arrival:
          $ref: '#/components/schemas/DerivalArrivalResponse'
        intercity:
          $ref: '#/components/schemas/CostsCalculation'
        small:
          $ref: '#/components/schemas/CostsCalculation'
        air:
          $ref: '#/components/schemas/CostsCalculation'
        express:
          $ref: '#/components/schemas/CostsCalculation'
        letter:
          $ref: '#/components/schemas/CostsCalculation'
        price:
          type: string
          description: Итоговая стоимость для выбранного вида перевозки
        priceMinimal:
          type: string
          description: "Способ перевозки с минимальной стоимостью. \r\nВозможные значения:\r\n\r\n- \"auto\"– автоперевозка;\r\n- \"express\" – экспресс-перевозка;\r\n- \"letter\" – доставка документов;\r\n- \"avia\" – авиаперевозка;\r\n- \"small\" – доставка малогабаритного груза"
        packages:
          type: array
          description: Информация о стоимости упаковки
          items:
            $ref: '#/components/schemas/CostsCalculation'
        orderDates:
          $ref: '#/components/schemas/OrderDates'
        deliveryTerm:
          type: integer
          description: Срок доставки груза от терминала получения до адреса (в днях)
        accompanyingDocuments:
          type: object
          description: Информация о стоимости отправки/возврата сопроводительных документов
          properties:
            send:
              $ref: '#/components/schemas/CostsCalculation'
            return:
              $ref: '#/components/schemas/CostsCalculation'
        insurance:
          type: string
          description: Общая стоимость страхования груза
        insuranceComponents:
          $ref: '#/components/schemas/InsuranceComponents'
        notify:
          $ref: '#/components/schemas/CostsCalculation'
        simpleShippingAvailable:
          type: boolean
          description: Доступность услуги упрощённой отправки
        availableDeliveryTypes:
          $ref: '#/components/schemas/AvailableDeliveryTypes'
        foundAddresses:
          type: array
          description: Результаты разбора адресов (если переданы address.search или paymentCitySearch)
          items:
            $ref: '#/components/schemas/FoundAddress'
        information:
          type: array
          description: Информационные сообщения от системы
          items:
            type: string
        handlingMech:
          description: Информация о стоимости механизированных погрузо-разгрузочных работ на терминале
          $ref: '#/components/schemas/CostsCalculation'
    DerivalArrivalResponse:
      type: object
      description: |-
        derival - Данные по доставке груза от отправителя

        arrival - Данные по доставке груза до получателя
      properties:
        terminal:
          type: string
          description: Город подразделения-отправителя / подразделения-получателя
        price:
          type: string
          description: Итоговая стоимость доставки от отправителя / до получателя
        contractPrice:
          type: boolean
          description: 'Флаг, обозначающий, что стоимость доставки является договорной. Если стоимость договорная (значение параметра – "true"), то значение параметров "price" и "servicePrice" – "null", информация о наценках и скидках отсутствует (массивы "premiumDetails" и "discountDetails" – пустые) '
        servicePrice:
          type: string
          description: "Стоимость услуги доставки груза от адреса отправителя / до адреса получателя (без учёта скидок и наценок)\r\n\r\nПараметр выводится только в том случае, если производится расчёт стоимости доставки непосредственно от/до адреса, то есть в запросе для параметра\"request.delivery.derival.variant\"/\"request.delivery.arrival.variant\" было передано значение \"address\"(в случае, если рассчитывается стоимость доставки от/до терминала, то есть было передано значение \"terminal\", параметр не выводится)"
        premiumDetails:
          type: array
          items:
            $ref: '#/components/schemas/PricingDetails'
        discountDetails:
          type: array
          items:
            $ref: '#/components/schemas/PricingDetails'
        terminals:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: 'ID терминала из "[Справочника терминалов](https://dev.dellin.ru/api/terminals/directory/)"'
              name:
                type: string
                description: Наименование подразделения
              address:
                type: string
                description: Адрес терминала
              streetCode:
                type: string
                description: 'Код КЛАДР улицы, см. метод "[Поиск улиц](https://dev.dellin.ru/api/places/search/#_header31)"'
              price:
                type: string
                description: Стоимость въезда на территорию терминала
              contractPrice:
                type: boolean
                description: 'Признак договорной цены. Если стоимость договорная (значение параметра – "true"), то значение параметра "price" – "null"'
              default:
                type: boolean
                description: 'Признак того, что терминал является терминалом по умолчанию для выбранного города'
              express:
                type: boolean
                description: 'Признак того, что на терминале может быть оказана услуга "Экспресс-перевозка"'
              isPVZ:
                type: boolean
                description: 'В настоящий момент параметр присутствует в ответе, но не используется'
        handling:
          $ref: '#/components/schemas/CostsCalculation'
    CostsCalculation:
      type: object
      properties:
        price:
          type: string
          description: Стоимость услуги
        contractPrice:
          type: boolean
          description: 'Признак договорной цены. Если стоимость договорная (значение параметра – "true"), то значение параметра "price" – "null", информация о наценках и скидках отсутствует (значения параметров "premium" и "discount" – "0", массивы "premiumDetails" и "discountDetails" – пустые) '
        premium:
          type: string
          description: Размер наценки по услуге
        discount:
          type: string
          description: Размер скидки по услуге
        premiumDetails:
          type: array
          items:
            $ref: '#/components/schemas/PricingDetails'
        discountDetails:
          type: array
          items:
            $ref: '#/components/schemas/PricingDetails'
            
    PricingDetails:
      type: object
      properties:
        name:
          type: string
          description: 'Наименование типа скидки/наценки. Например, "Наценка на негабарит" или "Открытая акция"'
        value:
          type: string
          description: Размер скидки/наценки в рублях
        date:
          type: string
          description: "Срок действия.Формат: \"ГГГГ-ММ-ДД\""
        announcement:
          type: boolean
          description: "Признак отношения к акциям.Возможные значения:\"true\" – скидка/наценка в рамках акции;\"false\" (или отсутствие параметра в пакете) – скидка/наценка вне акции"
        public:
          type: boolean
          description: "Признак публичной скидки/наценки. Для авторизованного пользователя наценки могут быть как публичными, так и индивидуальными. Для неавторизованного – только публичными.Возможные значения:\"true\" – публичная скидка/наценка;\"false\" (или отсутствие параметра в пакете) – индивидуальная скидка/наценка (доступно только для авторизованных пользователей)"
        triggers:
          type: array
          items:
            $ref: '#/components/schemas/Triggers'
      title: ''
      description: Подробная информация о наценках/скидках по услуге
      
      
